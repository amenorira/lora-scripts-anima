<html lang="zh-CN" data-theme="dark">

<main id="fixture" class="app-layout" x-data="monitorFixture">
  <div class="fixture-controls">
    <button class="btn btn-sm" @click="$el.closest('main').classList.toggle('narrow')">切换桌面窄窗口</button>
    <button class="btn btn-sm" @click="monitorData.state='CREATED';renderDashboard()">等待启动</button>
    <button class="btn btn-sm" @click="monitorData.state='RUNNING';monitorData.train_result=null;renderDashboard()">训练中</button>
    <button class="btn btn-sm" @click="monitorData.state='FINISHED';monitorData.step=740;monitorData.percent=100;monitorData.epoch='20/20';monitorData.elapsed='1:04:50';monitorData.lr=0;monitorData.train_result={status:'completed',duration_str:'1:04:50',ended_at:'2025-09-24T08:42:31+00:00'};lossSeries[1].points.push({step:740,value:0});lossSeries[1].latest=0;lossDataVersion++;renderDashboard()">训练完成</button>
    <button class="btn btn-sm" @click="monitorData.state='FAILED';monitorData.train_result={status:'failed',duration_str:'43:21'};monitorData.has_error=true;monitorData.error_msg='Sample failure';renderDashboard()">训练失败</button>
    <button class="btn btn-sm" @click="selectedRunDir='output/fixture';runDetailData={...monitorData,tensorboard_loss:lossSeries,perf_samples:monitorPerfSamples,state:'FINISHED',step:740,percent:100,epoch:'20/20',elapsed:'1:04:50',config:{output_name:'fixture',model_train_type:monitorData.training_profile||'anima-lora'},train_result:{status:'completed',duration_str:'1:04:50',ended_at:'2025-09-24T08:42:31+00:00'}};renderDashboard()">历史详情</button>
    <button class="btn btn-sm" @click="realtimeState='degraded';renderDashboard()">数据延迟</button>
    <button class="btn btn-sm" @click="advanceMetrics()">模拟下一步</button>
    <button class="btn btn-sm" @click="advanceMetrics();setTimeout(()=>advanceMetrics(),80);setTimeout(()=>advanceMetrics(),160)">快速连续更新</button>
    <button class="btn btn-sm" @click="appendFixtureLogs()">追加重复日志</button>
    <button class="btn btn-sm" @click="appendFixtureSample()">追加样本</button>
    <button class="btn btn-sm" @click="setTimeout(() => appendFixtureSample(), 1800)">延迟追加样本</button>
    <button class="btn btn-sm" @click="fixtureConfigRefreshed=false;setTimeout(()=>{trainParamsVersion++;renderDashboard();fixtureConfigRefreshed=true},500)">延迟刷新配置</button>
    <span x-show="fixtureConfigRefreshed">配置已刷新</span>
  </div>
  <div id="fixtureRoute" class="main-fullscreen"></div>
</main>
<script>
(async () => {
  const query = new URLSearchParams(location.search);
  const language = ['en-US', 'ja-JP'].includes(query.get('lang')) ? query.get('lang') : 'zh-CN';
  const configProfile = ['anima-lora', 'sdxl-lora', 'krea2-lora', 'moss-image-lora'].includes(query.get('configProfile')) ? query.get('configProfile') : '';
  const inferredRank = configProfile === 'krea2-lora' && query.get('rankFromWeights') === '1';
  const fixtureConfig = {
    model_train_type: configProfile || 'anima-lora',
    [configProfile === 'krea2-lora' ? 'dit' : 'pretrained_model_name_or_path']: 'C:/models/模型文件名较长的训练基础模型-anima-base-v1.0.safetensors',
    train_data_dir: 'D:/datasets/人物训练集/带有中文与空格的素材目录',
    network_module: configProfile === 'krea2-lora' ? (inferredRank ? 'networks.lora_krea2' : 'lycoris.kohya') : configProfile === 'moss-image-lora' ? 'networks.lora_generic' : configProfile === 'sdxl-lora' ? 'networks.lora' : 'networks.lora_anima',
    network_dim: 32, network_alpha: 16,
    ...(configProfile === 'krea2-lora' ? {max_train_steps: 1200, ...(inferredRank
      ? {network_weights: 'C:/models/initial-lora.safetensors', dim_from_weights: true}
      : {network_args: ['algo=lokr', 'factor=8']})} : {max_train_epochs: 20}),
    train_batch_size: 2, gradient_accumulation_steps: 4, resolution: '1024,1024', enable_bucket: true,
    seed: 0, learning_rate: 0.00006, optimizer_type: 'AdamW8bit', lr_scheduler: 'cosine',
    mixed_precision: 'bf16', gradient_checkpointing: true, output_name: 'fixture',
    ...(configProfile === 'krea2-lora'
      ? {krea_latent_cache_device: 'cuda', krea_text_cache_device: 'cpu', krea_cache_reuse: true, blocks_to_swap: 8}
      : {cache_latents: true, cache_latents_to_disk: true, cache_text_encoder_outputs: false}),
  };
  const fixtureParams = Object.entries(fixtureConfig).flatMap(([key, value]) => key === 'network_args'
    ? value.map(arg => { const [name, v] = arg.split('='); return {key: 'network_args.' + name, label_raw: name, value: v}; })
    : [{key, value, desc_key: 'field.' + key}]);
  const fixtureImages = query.getAll('image').filter(path => path.startsWith('/output/'));
  const fixtureImage = i => (fixtureImages[i % fixtureImages.length] || '/tests/frontend/monitor-sample.svg') + '?v=fixture';
  const delayMs = Math.max(0, Math.min(Number(query.get('delay')) || 0, 2000));
  document.documentElement.dataset.theme = query.get('theme') === 'light' ? 'light' : 'dark';
  document.documentElement.lang = language;
  const [html, translations] = await Promise.all([fetch('/frontend/index.html').then(r=>r.text()),fetch('/frontend/i18n/'+language+'.json', {cache:'no-store'}).then(r=>r.json())]);
  const parsed = new DOMParser().parseFromString(html,'text/html');
  document.getElementById('fixtureRoute').append(parsed.querySelector('.route-monitor-dashboard'));
  document.getElementById('fixtureRoute').append(parsed.querySelector('.config-snapshot-modal').closest('dialog'));
  const response = data => ({json:async()=>({status:'success',data}),ok:true});
  const sampleCount = Math.max(16, Math.min(20000, Math.floor((Number(query.get('sampleCount')) || 16) / 4) * 4));
  const samples = Array.from({length:sampleCount},(_,i)=>({name:`test_e${String(Math.floor(i/4)+1).padStart(6,'0')}_${String(i%4).padStart(2,'0')}_20261112000000_2333.png`,path:`sample/${i}.png`,url:fixtureImage(i),thumb_url:fixtureImage(i),inspect_url:fixtureImage(i)}));
  if (query.has('epochLoss')) samples.forEach((sample, i) => {
    const epoch = Math.floor(i / 4) + 1;
    const step = epoch * (query.has('longStages') ? 4000000 : 400);
    sample.sample = {batch_id: 'fixture-epoch-' + epoch, batch_label: `Epoch ${epoch} · Step ${step}`, batch_order: epoch,
      epoch, step, stage_kind: 'epoch', stage_value: epoch, batch_expected: 4, batch_status: 'complete',
      prompt_id: 'fixture-prompt-' + (i % 4), prompt_index: i % 4, seed: 2333,
      params: {prompt: 'Landscape ' + (i % 4 + 1), negative_prompt: '', seed: 2333, width: 512, height: 512,
        steps: 30, cfg_scale: 5, sampler: 'euler', scheduler: 'native', architecture: 'anima', flow_shift: 1},
      condition_key: 'fixture-settings', comparable: true, metadata_source: 'recorded'};
  });
  if (query.has('longName')) samples.push({name:'a-very-long-custom-sample-filename-for-viewer-layout-check.png',path:'sample/custom.png',url:fixtureImage(0),thumb_url:fixtureImage(0),inspect_url:fixtureImage(0)});
  const files = Array.from({length:12},(_,i)=>({name:`test-${String(i+1).padStart(6,'0')}.safetensors`,path:`test-${i}.safetensors`,category:'model',size:128000000,mtime:1700000000+i*60,ckpt_loss:.1-i*.003,ckpt_type:'epoch',ckpt_epoch:i+1}));
  const realFetch=window.fetch;
  // Include both legacy wrapped Rich output and the wider redirected layout.
  const logs = [
    '2026-09-19 12:47:16 INFO     Loading settings from                 args.py:1177',
    '                             C:\\training\\config\\autosave\\',
    '                             20260919-124708.toml...',
    '                    INFO     [Dataset 0]                     config_util.py:587',
    '                               batch_size: 2',
    '                               resolution: (1024, 1024)',
    '2026-09-20 12:47:25 INFO     Loading VAE from ./models/qwen_image_vae.safetensors'.padEnd(129) + 'qwen_image_autoencoder_kl.py:1631',
    '                    WARNING  <script>alert("plain text")<\/script>',
    ...Array.from({length:8}, (_, i) => `2026-10-02 11:29:${22 + i} INFO     epoch is incremented. current_epoch: 0, epoch: 17  dataset.py:462`),
    ...Array.from({length:40},(_,i)=>{
      const step=479+i;
      const seconds=Math.round(2601-(39-i)*5.26+Math.sin(i*.7)-Math.sin(39*.7));
      const elapsed=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
      const speed=(5.26+.22*Math.sin(i*.45)+.08*Math.sin(i*1.2)).toFixed(2);
      const estimate=3715+Math.round(42*(Math.sin(i*.4)-Math.sin(39*.4))+12*(Math.sin(i*1.15)-Math.sin(39*1.15)));
      const remaining=estimate-seconds;
      const eta=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
      return `steps: ${Math.round(step/740*100)}%|#######---| ${step}/740 [${elapsed}<${eta}, ${speed}s/it, avr_loss=0.123]`;
    }),
  ];
  window.fetch=(url,opts)=> {
    if (!String(url).startsWith('/api/')) return realFetch(url,opts);
    if (String(url).includes('config-from-run')) return Promise.resolve(response({name: 'fixture', run_dir: 'output/fixture',
      params: fixtureConfig, reuse_params: fixtureConfig,
      config_format: 'toml', content: Object.entries(fixtureConfig).map(([key, value]) => key + ' = ' + JSON.stringify(value)).join('\n')}));
    const query = new URL(String(url), location.href).searchParams.get('q') || '';
    const result = response(String(url).includes('outputs')?files.slice():String(url).includes('previews')?samples.slice():String(url).includes('log-slice')?{total:logs.length,offset:0,lines:logs.slice(),match_indices:logs.flatMap((line,i)=>query && line.toLowerCase().includes(query.toLowerCase())?[i]:[])}:[]);
    return delayMs && /\/(?:outputs|previews|log-slice)\?/.test(String(url))
      ? new Promise(resolve => setTimeout(() => resolve(result), delayMs)) : Promise.resolve(result);
  };
  document.addEventListener('alpine:init',()=>Alpine.data('monitorFixture',()=>{
    const a=Object.defineProperties({}, {...Object.getOwnPropertyDescriptors(window.utilsMixin),...Object.getOwnPropertyDescriptors(window.monitorCoreMixin),...Object.getOwnPropertyDescriptors(window.monitorRenderMixin)});
    return Object.assign(a,{
      escapeJsString: window.trainingCoreMixin.escapeJsString, currentRoute:'monitor-dashboard',locale:language,realtimeState:'online',liveTaskId:'fixture',fixtureConfigRefreshed:false,
      t(key,fb){return String(key||'').split('.').reduce((v,k)=>v&&v[k],translations)||fb||key;},
      toast(message){console.log(message);},finishProgress(){},navigate(){},stopMonitorRealtime(){},startMonitorRealtime(){},
      _fieldOptionLabel: window.trainingCoreMixin._fieldOptionLabel,
      _fieldDefinition: window.trainingCoreMixin._fieldDefinition,
      form: { model_train_type: 'anima-lora' },
      appendFixtureLogs(){
        const offset=logs.length;
        const batch=Array.from({length:8},()=> '2026-10-02 11:30:22 INFO     epoch is incremented. current_epoch: 0, epoch: 18  dataset.py:462');
        logs.push(...batch);
        this.handleRealtimeTaskLog({data:{lines:batch,offset,log_total:logs.length}});
        this.renderDashboard();
      },
      appendFixtureSample(){
        const i=samples.length;
        samples.push({name:`test_e${String(Math.floor(i/4)+1).padStart(6,'0')}_${String(i%4).padStart(2,'0')}_20261112000001_2333.png`,path:`sample/${i}.png`,url:fixtureImage(i),thumb_url:fixtureImage(i),inspect_url:fixtureImage(i)});
        this._applyPreviewSnapshot(samples.slice());
        this.renderDashboard();
      },
      advanceMetrics(){
        if(this.selectedRunDir) { this.selectedRunDir=null; this.runDetailData=null; }
        const d=this.monitorData;
        d.state='RUNNING';d.train_result=null;d.step++;d.percent=d.step/d.total_steps*100;
        d.speed=(5.1+(d.step%7)*.07).toFixed(2)+' s/it';
        d.elapsed=this._formatMonitorDuration('',2601+(d.step-518)*5);
        d.eta=this._formatMonitorDuration('',1114-(d.step-518)*5);
        this._recordMonitorPerfSample(d);
        const current=this.lossSeries.find(s=>s.tag==='loss/current');
        const previous=current.points.at(-1).value;
        current.points.push({step:d.step,value:previous*(d.step%2?1.038:.962)});
        current.points=current.points.slice(-160);
        this.lossSeries[0].points.push({step:d.step,value:.035+(d.step%5)*.0002});
        this.lossSeries[0].points=this.lossSeries[0].points.slice(-160);
        this.lossSeries[1].latest=Math.max(0,.0000426-(d.step-518)*.0000001);
        this.lossSeries[1].points.push({step:d.step,value:this.lossSeries[1].latest});
        this.lossDataVersion++;this.renderDashboard();
      },
      monitorData:{state:'RUNNING',step:518,total_steps:740,percent:70,loss:.0337,lr:4.26e-5,epoch:14,elapsed:'43:21',eta:'18:34',speed:'5.26 s/it',run_dir:'output/fixture',artifact_dir:'C:/training/models',active_task:{id:'fixture'},training_profile:configProfile||'anima-lora'},
      previews:samples.slice(),previewsVersion:1,weakNetworkMode:true,
      sampleLossMode: ['off', 'overall', 'detailed'].includes(query.get('lossMode')) ? query.get('lossMode') : 'off',
      logLines:logs,
      gpuInfo:{name:'GPU fixture',gpu_load_pct:98,vram_used_mb:19000,vram_total_mb:24000,temperature_c:65,power_w:280},
      sysInfo:{cpu_name:'CPU fixture',cpu_pct:35,ram_pct:40,ram_used_gb:24,ram_total_gb:64},
      lossSeries:[
        {tag:'loss/average',points:Array.from({length:160},(_,i)=>{const j=i-40;return {step:359+i,value:j<60?.027+Math.sin(j)*.0003:j<90?.039+Math.sin(j)*.001:.034-(j-90)*.00001+Math.sin(j)*.0002};})},
        {tag:'lr/unet',max:.00006,latest:.0000426,points:Array.from({length:120},(_,i)=>({step:399+i,value:.00006-i*(.0000174/119)}))},
        {tag:'loss/current',points:Array.from({length:160},(_,i)=>({step:359+i,value:.034+Math.sin((i-40)*.7)*.004}))}
      ],
      trainParams:configProfile ? fixtureParams : [
        {key:'pretrained_model_name_or_path',value:'C:/models/anima-base-v1.0.safetensors',section:'model'},
        {key:'learning_rate',value:'6e-5',section:'training'},
        {key:'lr_scheduler',value:'cosine',section:'optimizer'},
        {key:'lr_warmup_steps',value:'0.1',section:'optimizer'},
        {key:'network_dim',value:32,section:'network'},
        {key:'network_alpha',value:32,section:'network'},
        {key:'max_train_epochs',value:20,section:'training'},
        {key:'optimizer_type',value:'pytorch_optimizer.Came',section:'optimizer'},
        {key:'train_batch_size',value:2,section:'training'},
        {key:'resolution',value:'1024, 1024',section:'model'},
        {key:'seed',value:1337,section:'training'},
        ...Array.from({length:41},(_,i)=>({key:`fixture_param_${i}`,value:i,section:['model','network','training','optimizer','caption','save','performance'][i%7]}))
      ],
      init(){
        if (query.has('epochLoss')) {
          this.monitorData.log_timestep_loss = query.get('epochLoss') !== 'overall';
          const epochValues = sampleCount === 16 ? [.1382, .1147, .1016, .0943]
            : Array.from({length: sampleCount / 4}, (_, i) => .14 / (1 + i / 120));
          this.lossSeries.push({tag: 'loss/epoch', points: epochValues.map((value, i) => ({step: i + 1, value}))});
          if (this.monitorData.log_timestep_loss) ['low', 'mid', 'high'].forEach((key, n) => {
            this.lossSeries.push({tag: 'loss/timestep/epoch/' + key, points: epochValues.map((value, i) => ({step: i + 1, value: value * [.4, .91, 1.69][n]}))});
          });
          this.lossDataVersion++;
        }
        this._ingestMonitorPerfSamples(this._parseMonitorPerfLogs(logs));this._applyMonitorLogSnapshot(logs,logs.length);this._applyOutputCount('output/fixture',files.length);this._startMonitorClock();this.$nextTick(()=>this.renderDashboard());
      }
    });
  }));
  if (query.has('stress')) {const stress = document.createElement('script');stress.src='/cache/dev/epoch-loss/stress-harness.js';document.head.append(stress);}
  const script=document.createElement('script');script.src='/frontend/js/vendor/alpine.min.js';document.head.append(script);
})();
</script>
</html>
