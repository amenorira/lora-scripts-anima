<section class="tool-workspace" @paste.window="handleTaggerPaste($event)">
  <header class="tool-header page-heading-row" x-workspace-part="header"
          x-data="{toolTitle: () => t(currentRoute === 'ai-captioning' ? 'moss.pageTitle' : 'tagger.title'), toolResourceId: 'taggerResbar'}"></header>
  <div class="ui-inline-alert" x-show="currentRoute === 'tagger' && _taggerItemsError?.taskId === taggerTaskId" role="alert" x-cloak>
    <span x-text="t('common.requestFailed')"></span>
    <button type="button" class="btn btn-sm btn-secondary" @click="refreshTaggerItems(_taggerItemsError?.reset)" x-text="t('monitor.retryLoad')"></button>
  </div>

  <nav class="monitor-tabs tool-tabs" x-workspace-part="tabs" x-show="currentRoute === 'tagger'" role="tablist" :aria-label="t('tagger.sourceType')"
       x-data="toolWorkspaceTabs(() => taggerSourceMode, () => [
         {key:'folder', id:'tagger-tab-folder', panel:'tagger-panel-workflow', icon:'folder', label:t('tagger.batchMode'), select:() => selectTaggerSourceMode('folder')},
         {key:'single', id:'tagger-tab-single', panel:'tagger-panel-workflow', icon:'image', label:t('tagger.singleMode'), select:() => selectTaggerSourceMode('single')}
       ], () => taggerRunning || taggerStarting || taggerScanning)" @keydown="moveToolTab($event)"></nav>


  <div class="tool-notice" x-show="(trainingActive || regularizationActive) && (currentRoute !== 'ai-captioning' || captionTab === 'batch')" role="status">
    <span x-text="currentRoute === 'ai-captioning' ? t('caption.batchBusy') : regularizationActive ? t('common.regularizationBlocked') : t('tagger.trainingBlocked')"></span>
    <button type="button" class="btn btn-secondary btn-sm" @click="navigate(regularizationActive ? 'regularization' : 'monitor-dashboard')"><span x-text="regularizationActive ? t('common.viewGeneration') : t('tagger.openMonitor')"></span><svg aria-hidden="true"><use href="#ti-external"></use></svg></button>
  </div>

  <template x-if="taggerSourceMode === 'folder'">
    <div class="tool-batch-layout" role="tabpanel" id="tagger-panel-workflow" aria-labelledby="tagger-tab-folder">
      <main class="tool-form-column tool-field-form">
        <section class="tool-form-section" :aria-label="t('tagger.basicSettings')">
          <div class="field">
            <label class="field-key" for="tagger-source-folder" x-text="t('tagger.imageDir')"></label>
            <div class="field-input-row field-input-wrap">
              <input id="tagger-source-folder" type="text" x-model="taggerSourcePath" spellcheck="false" @input="scheduleTaggerSourceScan()" @keydown.enter.prevent="scanTaggerSource()" :placeholder="t('tagger.sourcePath')">
              <div class="field-input-actions">
                <button type="button" class="btn-icon" x-show="localPickerAvailable" @click="pickTaggerSource()" :title="t('common.browse')" :aria-label="t('common.browse')"><svg aria-hidden="true"><use href="#ti-folder"></use></svg></button>
              </div>
            </div>
          </div>
        </section>

        <section class="tool-form-section" :aria-label="t('tagger.modelSettings')">
          <div class="tool-field-grid">
            <div class="field">
              <div class="field-row is-stacked">
                <div class="field-info">
                  <label class="field-key" for="tagger-model-select" x-text="t('tagger.model')"></label>
                  <p class="field-desc" x-text="taggerRuntimeLabel() + ' · ' + t(taggerModel()?.installed ? 'tagger.installed' : 'tagger.firstUseDownload')"></p>
                </div>
                <div class="field-control">
                  <div class="anima-select tagger-model-select" x-data="animaSelect(() => taggerModelSelectConfig(), taggerSelectedModel)" x-effect="value = taggerSelectedModel" @click.outside="close()" @anima-select-change="changeTaggerModel($event.detail.value)">
                    <input type="hidden" x-ref="modelInput" :value="taggerSelectedModel">
                    <button id="tagger-model-select" type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.model')"><span class="anima-select-trigger-text" x-text="taggerModel()?.name || t('tagger.model')"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                    <template x-if="open" x-workspace-part="select-menu"></template>
                  </div>
                </div>
              </div>
            </div>
            <div class="field" x-show="taggerSelectedModel === 'pixai-tagger-v1.0'">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-precision-select" x-text="t('tagger.precision')"></label><p class="field-desc" x-text="t('tagger.precisionHelp')"></p></div>
                <div class="field-control">
                  <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPrecisionSelectConfig(), taggerSettings.precision)" x-effect="value = taggerSettings.precision" @click.outside="close()" @anima-select-change="taggerSettings.precision = $event.detail.value; saveTaggerSettings()">
                    <input type="hidden" :value="taggerSettings.precision">
                    <button id="tagger-precision-select" type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.precision')"><span class="anima-select-trigger-text" x-text="t('tagger.precision_' + taggerSettings.precision)"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                    <template x-if="open" x-workspace-part="select-menu"></template>
                  </div>
                </div>
              </div>
            </div>
            <div class="field">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-preset-select" x-text="t('tagger.presetLabel')"></label><p class="field-desc" x-text="t('tagger.presetHelp')"></p></div>
                <div class="field-control">
                  <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="close()" @anima-select-change="applyTaggerPreset($event.detail.value)">
                    <input type="hidden" x-ref="modelInput" :value="taggerSettings.preset">
                    <button id="tagger-preset-select" type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)" :aria-label="t('tagger.presetLabel')"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                    <template x-if="open" x-workspace-part="select-menu"></template>
                  </div>
                </div>
              </div>
            </div>
            <div class="field" x-show="!taggerUsesCategoryThresholds()">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-threshold-input" x-text="t('tagger.threshold')"></label><p class="field-desc" x-text="t('tagger.thresholdDesc')"></p></div>
                <div class="field-control"><div class="stepper"><button type="button" @click="taggerSettings.threshold = Number(Math.max(0, Number(taggerSettings.threshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input id="tagger-threshold-input" type="number" :aria-label="t('tagger.threshold')" min="0" max="1" step="0.01" x-model.number="taggerSettings.threshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.threshold = Number(Math.min(1, Number(taggerSettings.threshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
              </div>
            </div>
            <div class="field" x-show="taggerSupportsCharacterToggle()">
              <div class="field-row">
                <div class="field-info"><label class="field-key" for="tagger-character-enable" x-text="t('tagger.characterRecognition')"></label></div>
                <div class="field-control"><label class="toggle"><input id="tagger-character-enable" type="checkbox" :checked="taggerCharacterEnabled()" :aria-label="t('tagger.characterRecognition')" @change="setTaggerCharacterEnabled($event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></label></div>
              </div>
            </div>
            <div class="field" x-show="taggerSupportsCharacterToggle() && taggerCharacterEnabled()">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-character-threshold" x-text="t('tagger.characterThreshold')"></label><p class="field-desc" x-text="t('tagger.characterThresholdDesc')"></p></div>
                <div class="field-control"><div class="stepper"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.max(0, Number(taggerSettings.characterThreshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input id="tagger-character-threshold" type="number" :aria-label="t('tagger.characterThreshold')" min="0" max="1" step="0.01" x-model.number="taggerSettings.characterThreshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.min(1, Number(taggerSettings.characterThreshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
              </div>
            </div>
          </div>
          <div class="tool-field-grid tagger-category-settings" x-show="taggerUsesCategoryThresholds()">
            <template x-for="key in taggerCategoryKeys()" :key="key">
              <div class="field">
                <div class="field-row tagger-threshold-row">
                  <label class="tagger-category-name tagger-category-toggle">
                    <span class="toggle"><input type="checkbox" :checked="taggerCategoryEnabled(key)" @change="setTaggerCategoryEnabled(key, $event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
                    <span x-text="taggerCategoryLabel(key)"></span>
                  </label>
                  <div class="stepper">
                    <button type="button" @click="adjustTaggerCategoryThreshold(key, -0.01)" :aria-label="t('tagger.decreaseThreshold').replace('{name}', taggerCategoryLabel(key))">&minus;</button>
                    <input type="number" :aria-label="taggerCategoryLabel(key) + ' ' + t('tagger.threshold')" min="0" max="1" step="0.001" x-model.number="taggerSettings.categoryThresholds[key]" @change="updateTaggerCategorySetting(key)">
                    <button type="button" @click="adjustTaggerCategoryThreshold(key, 0.01)" :aria-label="t('tagger.increaseThreshold').replace('{name}', taggerCategoryLabel(key))">+</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>


        <section class="tool-form-section" :aria-label="t('tagger.outputOptions')">
          <div class="tool-field-grid">
            <div class="field tool-field-wide">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-conflict-select" x-text="t('tagger.conflictAction')"></label></div>
                <div class="field-control">
                  <div class="anima-select" x-data="animaSelect(() => taggerConflictSelectConfig(), taggerSettings.conflict)" x-effect="value = taggerSettings.conflict" @click.outside="close()" @anima-select-change="taggerSettings.conflict = $event.detail.value; saveTaggerSettings()">
                    <input type="hidden" x-ref="modelInput" :value="taggerSettings.conflict">
                    <button id="tagger-conflict-select" type="button" class="anima-select-trigger" :class="{focused:open}" :aria-label="t('tagger.conflictAction')" @click="value = taggerSettings.conflict; toggle($event)">
                      <span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{open}"><use href="#ti-chevron"></use></svg>
                    </button>
                    <template x-if="open" x-workspace-part="select-menu"></template>
                  </div>
                </div>
              </div>
            </div>
            <div class="field">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-additional-tags" x-text="t('tagger.additionalTags')"></label><p class="field-desc" x-text="t('tagger.additionalTagsDesc')"></p></div>
                <input id="tagger-additional-tags" type="text" x-model="taggerSettings.additionalTags" @change="saveTaggerSettings()" placeholder="1girl, solo">
              </div>
            </div>
            <div class="field">
              <div class="field-row is-stacked">
                <div class="field-info"><label class="field-key" for="tagger-exclude-tags" x-text="t('tagger.excludeTags')"></label><p class="field-desc" x-text="t('tagger.excludeTagsDesc')"></p></div>
                <input id="tagger-exclude-tags" type="text" x-model="taggerSettings.excludeTags" @change="saveTaggerSettings()" placeholder="watermark, text">
              </div>
            </div>
          </div>
          <div class="tool-field-grid tagger-option-grid">
            <label class="field"><span><b class="field-key" x-text="t('tagger.recursive')"></b></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.recursive" @change="saveTaggerSettings(); scanTaggerSource()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field"><span><b class="field-key" x-text="t('tagger.replaceUnderscore')"></b></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.replaceUnderscore" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field"><span><b class="field-key" x-text="t('tagger.escapeTag')"></b><small class="field-desc" x-text="t('tagger.escapeTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.escapeTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field"><span><b class="field-key" x-text="t('tagger.removeDuplicated')"></b></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.removeDuplicated" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field" x-show="taggerSupportsStandaloneRatingToggle()"><span><b class="field-key" x-text="t('tagger.addRatingTag')"></b><small class="field-desc" x-text="t('tagger.addRatingTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addRatingTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field" x-show="taggerSupportsModelTag()"><span><b class="field-key" x-text="t('tagger.addModelTag')"></b><small class="field-desc" x-text="t('tagger.addModelTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addModelTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field"><span><b class="field-key" x-text="t('tagger.unloadModel')"></b><small class="field-desc" x-text="t('tagger.unloadModelDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.unloadModel" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
          </div>
        </section>

      </main>

      <aside class="tool-action-panel" :aria-label="t('tagger.batchMode')">
        <div class="tool-action-source" :class="{ ready: taggerSource?.total }"><svg><use href="#ti-folder"></use></svg><div><strong x-text="taggerSource?.total ? (taggerSource.total + ' ' + t('tagger.images')) : t('tagger.noSource')"></strong><span x-loop-marquee.bounce :title="taggerSource?.path || t('tagger.imageDirDesc')"><span x-text="taggerSource?.path || t('tagger.imageDirDesc')"></span></span></div></div>
        <div class="tool-source-summary" x-show="taggerSource"><span><strong x-text="taggerSource?.total || 0"></strong><small x-text="t('tagger.images')"></small></span><span><strong x-text="taggerSource?.directories || 0"></strong><small x-text="t('tagger.folders')"></small></span><span><strong x-text="taggerSource?.with_caption || 0"></strong><small x-text="t('tagger.captions')"></small></span></div>
        <button type="button" class="btn btn-start tool-action" x-show="!taggerRunning" @click="startTagger()" :disabled="!taggerCanStart()"><svg><use href="#ti-play"></use></svg><span x-text="taggerStartLabel()"></span></button>
        <button type="button" class="btn btn-stop tool-action" x-show="taggerRunning" @click="cancelTagger()"><svg><use href="#ti-stop"></use></svg><span x-text="t('tagger.stop')"></span></button>
        <div class="tool-task-status" x-show="taggerTask">
          <div class="tool-task-title"><i :class="taggerTask?.status || 'idle'"></i><strong x-text="taggerPhaseLabel()"></strong><span x-text="taggerTaskProgressText()"></span></div>
          <div class="tool-progress-track" role="progressbar" :aria-label="taggerPhaseLabel()" :aria-valuenow="taggerProgressPercent()" aria-valuemin="0" aria-valuemax="100"><i :style="'width:' + taggerProgressPercent() + '%'"></i></div>
          <div class="tool-task-file" x-text="taggerTask?.current_file || ''"></div>
          <dl><div><dt x-text="t('tagger.speed')"></dt><dd x-text="taggerTask?.speed ? t('tagger.speedValue').replace('{speed}', taggerTask.speed) : '--'"></dd></div><div><dt x-text="t('tagger.eta')"></dt><dd x-text="formatTaggerEta(taggerTask?.eta_seconds)"></dd></div><div><dt x-text="t('tagger.success')"></dt><dd class="success" x-text="taggerTask?.success || 0"></dd></div><div><dt x-text="t('tagger.skipped')"></dt><dd class="skipped" x-text="taggerTask?.skipped || 0"></dd></div><div><dt x-text="t('tagger.failed')"></dt><dd class="failed" x-text="taggerTask?.failed || 0"></dd></div></dl>
        </div>
        <button type="button" class="btn btn-secondary tool-action" x-show="taggerTask?.failed" :disabled="taggerRunning || taggerStarting" @click="retryFailedTagger()"><svg><use href="#ti-retry"></use></svg><span x-text="t('tagger.retryFailed')"></span></button>
        <button type="button" class="btn btn-secondary tool-action" x-show="taggerTask?.status === 'done' && taggerSource?.kind === 'folder'" @click="openTaggerDatasetInEditor()"><span x-text="t('tagger.openTagEditor')"></span><svg><use href="#ti-external"></use></svg></button>
        <section class="tool-task-log" x-workspace-part="task-log" :class="{expanded:taggerLogsOpen}"
                 x-data="toolTaskLog(() => taggerWorkspaceLog(), () => taggerLogsOpen = !taggerLogsOpen)"></section>
      </aside>
    </div>
  </template>

  <template x-if="taggerSourceMode === 'single'">
    <div
      class="tool-single-layout" role="tabpanel" id="tagger-panel-workflow" aria-labelledby="tagger-tab-single"
      :style="'--tagger-single-left:' + taggerSingleLeftWidth + '%'"
    >
      <div class="tool-single-main">
        <section class="tool-preview" x-workspace-part="single-preview"
                 x-data="{previewImageUrl: () => taggerPreviewUrl(taggerSelectedIndex), previewDisabled: () => taggerRunning || taggerStarting || taggerScanning, choosePreviewImage: () => pickTaggerSource()}"
                 :class="{'drag-over':taggerDragOver, empty:!taggerSource}" @dragover.prevent="taggerDragOver = true"
                 @dragleave="if (!$el.contains($event.relatedTarget)) taggerDragOver = false" @drop.prevent="handleTaggerDrop($event)"></section>

        <div class="tool-single-actions">
          <button type="button" class="btn btn-secondary" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="pickTaggerSource()"><svg aria-hidden="true"><use href="#ti-image"></use></svg><span x-text="t('caption.chooseImage')"></span></button>
          <button type="button" class="btn btn-ghost tool-clear-button" x-show="!taggerRunning" :disabled="!taggerSource || taggerStarting || taggerScanning" @click="clearTaggerSource()" x-text="t('common.clear')"></button>
          <button type="button" class="btn btn-start tool-action" x-show="!taggerRunning" @click="startTagger()" :disabled="!taggerCanStart()"><svg><use href="#ti-play"></use></svg><span x-text="taggerStartLabel()"></span></button>
          <button type="button" class="btn btn-stop tool-action" x-show="taggerRunning" @click="cancelTagger()"><svg><use href="#ti-stop"></use></svg><span x-text="t('tagger.stop')"></span></button>
        </div>

        <section class="tagger-single-result">
          <header class="tagger-output-heading">
            <h2><span x-text="t('tagger.outputText')"></span></h2>
            <div class="tagger-output-format"><label class="field-feedback"><span class="toggle"><input type="checkbox" x-model="taggerSettings.replaceUnderscore" @change="updateTaggerOutputSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span><span x-text="t('tagger.replaceUnderscore')" :title="t('tagger.replaceUnderscoreDesc')"></span></label><label class="field-feedback"><span class="toggle"><input type="checkbox" x-model="taggerSettings.escapeTag" @change="updateTaggerOutputSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span><span x-text="t('tagger.escapeTag')" :title="t('tagger.escapeTagDesc')"></span></label><label class="field-feedback"><span class="toggle"><input type="checkbox" x-model="taggerSettings.removeDuplicated" @change="updateTaggerOutputSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span><span x-text="t('tagger.removeDuplicated')" :title="t('tagger.removeDuplicatedDesc')"></span></label></div>
            <button type="button" class="btn btn-ghost btn-sm" x-show="taggerResultText" @click="copyTaggerResult()"><svg><use href="#ti-copy"></use></svg><span x-text="t('tagger.copyTags')"></span></button>
          </header>
          <div class="tagger-result-tags" x-show="taggerResultText" x-text="taggerResultText" tabindex="0" :aria-label="t('tagger.totalTags')"></div>
          <div class="tagger-single-empty tagger-result-empty" x-show="!taggerResultText" x-text="t('tagger.noResult')"></div>
        </section>
      </div>

      <div class="tool-divider-slot" x-workspace-part="divider"></div>

      <aside class="tool-single-sidebar">
        <section class="tagger-single-config" :class="{ 'has-precision': taggerSelectedModel === 'pixai-tagger-v1.0' }" :aria-label="t('tagger.modelSettings')">
          <div class="tagger-model-row">
          <div class="field-feedback tagger-compact-field tagger-compact-model"><span x-text="t('tagger.model')"></span><div class="anima-select tagger-model-select" x-data="animaSelect(() => taggerModelSelectConfig(), taggerSelectedModel)" x-effect="value = taggerSelectedModel" @click.outside="close()" @anima-select-change="changeTaggerModel($event.detail.value)"><input type="hidden" x-ref="modelInput" :value="taggerSelectedModel"><button type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.model')"><span class="anima-select-trigger-text" x-text="taggerModel()?.name || t('tagger.model')"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button><template x-if="open" x-workspace-part="select-menu"></template></div></div>
          </div>
          <div class="tagger-compact-row">
            <div class="field-feedback tagger-compact-field"><span x-text="t('tagger.presetLabel')"></span><div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="close()" @anima-select-change="applyTaggerPreset($event.detail.value)"><input type="hidden" :value="taggerSettings.preset"><button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)" :aria-label="t('tagger.presetLabel')"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button><template x-if="open" x-workspace-part="select-menu"></template></div></div>
            <div class="field-feedback tagger-compact-field" x-show="taggerSelectedModel === 'pixai-tagger-v1.0'"><span :title="t('tagger.precisionHelp')" x-text="t('tagger.precision')"></span><div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPrecisionSelectConfig(), taggerSettings.precision)" x-effect="value = taggerSettings.precision" @click.outside="close()" @anima-select-change="taggerSettings.precision = $event.detail.value; saveTaggerSettings()">
                <input type="hidden" :value="taggerSettings.precision">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.precision')"><span class="anima-select-trigger-text" x-text="t('tagger.precision_' + taggerSettings.precision)"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open" x-workspace-part="select-menu"></template>
              </div></div>
          </div>
          <div class="tagger-config-options">
            <label class="field-feedback tagger-compact-option"><span :title="t('tagger.unloadModelDesc')" x-text="t('tagger.unloadModel')"></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.unloadModel" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label class="field-feedback tagger-compact-option" x-show="tagDictionaryIsChinese()"><span x-text="t('tagger.showTranslation')"></span><span class="toggle"><input type="checkbox" :checked="tagDictionaryShowTranslation" @change="tagDictionaryToggleTranslation()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
          </div>
        </section>
        <section class="tagger-single-categories">
          <header class="tagger-results-heading">
            <h2 x-text="t('tagger.resultHeading')"></h2><span x-show="Object.keys(taggerCategoryState).length" x-text="Object.values(taggerCategoryState).reduce((total, category) => total + category.visibleTags.length, 0)"></span>
            <div class="tagger-results-actions">
              <button type="button" class="btn btn-ghost btn-sm" @click="setTaggerCategoriesCollapsed(true, $el.closest('.tagger-single-categories'))" :disabled="!Object.keys(taggerCategoryState).length"><svg aria-hidden="true"><use href="#ti-collapse-all"></use></svg><span x-text="t('tagger.collapseAll')"></span></button>
              <button type="button" class="btn btn-ghost btn-sm" @click="setTaggerCategoriesCollapsed(false, $el.closest('.tagger-single-categories'))" :disabled="!Object.keys(taggerCategoryState).length"><svg aria-hidden="true"><use href="#ti-expand-all"></use></svg><span x-text="t('tagger.expandAll')"></span></button>
            </div>
          </header>
          <div class="tagger-category-browser">
            <div class="tagger-threshold-row tagger-category-columns"><span x-text="t('tagger.includeOutput')"></span><span :title="t('tagger.filterHelp')" x-text="t('tagger.threshold')"></span></div>
            <template x-for="row in taggerSingleCategories()" :key="row.key">
              <section class="tagger-category-section" :data-category="row.key" :class="{ collapsed: row.result?.collapsed }">
                <div class="tagger-threshold-row tagger-category-heading field-feedback" :class="{ 'is-collapsible': row.result }" @click="if (row.result && !$event.target.closest('button, input, label, .stepper')) $el.querySelector('.tagger-category-heading-toggle').click()">
                  <div class="tagger-category-name">
                    <label class="toggle"><input type="checkbox" :id="'tagger-single-category-' + row.key" :checked="taggerSingleCategoryEnabled(row.key)" @change="setTaggerSingleCategoryEnabled(row.key, $event.target.checked)" :aria-label="t('tagger.includeCategory').replace('{name}', row.label)" :disabled="!row.result && !taggerUsesCategoryThresholds() && row.key !== 'character'"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>
                    <label class="tagger-category-toggle" x-show="!row.result" :for="'tagger-single-category-' + row.key" x-text="row.label"></label>
                    <button type="button" class="tagger-category-heading-toggle" x-show="row.result" @click="row.result.collapsed = !row.result.collapsed; _animateCollapse($el.closest('.tagger-category-section').querySelector('.tagger-category-body'), row.result.collapsed); syncTaggerDictionary()" :aria-expanded="String(!row.result?.collapsed)">
                      <span x-text="row.label"></span><small x-text="row.result?.visibleTags.length || 0"></small><svg aria-hidden="true" :class="{ open: !row.result?.collapsed }"><use href="#ti-chevron"></use></svg>
                    </button>
                    <button type="button" class="tagger-category-copy" x-show="row.result" @click="copyTaggerCategory(row.key)" :disabled="!row.result?.visibleTags.length" :title="t('tagger.copyCategoryTags')" :aria-label="t('tagger.copyCategoryTags')"><svg><use href="#ti-copy"></use></svg></button>
                  </div>
                  <div class="stepper" x-show="taggerCategoryKeys().includes(row.key) || (!taggerUsesCategoryThresholds() && ['general', 'character'].includes(row.key))">
                    <button type="button" @click="setTaggerSingleCategoryThreshold(row.key, Number(taggerSingleCategoryThreshold(row.key)) - 0.01)" :aria-label="t('tagger.decreaseThreshold').replace('{name}', row.label)">&minus;</button>
                    <input type="number" min="0" max="1" step="0.001" :value="taggerSingleCategoryThreshold(row.key)" @change="setTaggerSingleCategoryThreshold(row.key, $event.target.value); $event.target.value = taggerSingleCategoryThreshold(row.key)" :aria-label="row.label + ' ' + t('tagger.threshold')">
                    <button type="button" @click="setTaggerSingleCategoryThreshold(row.key, Number(taggerSingleCategoryThreshold(row.key)) + 0.01)" :aria-label="t('tagger.increaseThreshold').replace('{name}', row.label)">+</button>
                  </div>
                </div>
                <div class="tagger-category-body" :inert="!!row.result?.collapsed">
                  <div class="tagger-category-tags" x-show="row.result">
                    <template x-for="tag in row.result ? taggerCategoryPreview(row.result) : []" :key="tag[0]"><span class="tagger-confidence-item" :data-tag="tag[0]" tabindex="0" :class="tagDictionaryChipState(tag[0])"><span class="tagger-confidence-label"><code x-text="taggerDisplayName(tag[0])"></code><small class="tagger-tag-translation" x-text="tagDictionaryTranslationFor(tag[0])"></small></span><b x-text="Number(tag[1]).toFixed(3)"></b></span></template>
                    <p x-show="row.result && !row.result.visibleTags.length" x-text="t('tagger.noTags')"></p>
                    <small x-show="row.result?.visibleTags.length > 200" x-text="t('tagger.tagTruncated').replace('{total}', row.result?.visibleTags.length || 0)"></small>
                  </div>
                </div>
              </section>
            </template>
            <div class="tagger-dictionary-tools" x-show="Object.keys(taggerCategoryState).length && !tagDictionaryReady"><button type="button" class="btn btn-ghost btn-sm" @click="navigate('environment')" x-text="t('tagger.dictionaryUnavailable')"></button></div>
          </div>
        </section>
      </aside>
    </div>
  </template>
  <div id="captionWorkspaceMount"></div>
</section>
<input id="taggerFileInput" type="file" accept="image/*" hidden @change="handleTaggerFileInput($event)">
