<div class="regularization-workspace tool-workspace">
  <header class="tool-header page-heading-row" x-workspace-part="header"
          x-data="{toolTitle: () => regT('subtitle'), toolResourceId: 'regularizationResbar'}"></header>
  <nav class="monitor-tabs tool-tabs" x-workspace-part="tabs" role="tablist" :aria-label="regT('title')"
       x-data="toolWorkspaceTabs(() => regTab, () => [
         {key:'settings', id:'reg-tab-settings', panel:'reg-panel-settings', icon:'settings', label:regT('settings'), select:() => regShowSettings()},
         {key:'plan', id:'reg-tab-plan', panel:'reg-panel-gallery', icon:'list', label:regT('detailedPlan'), select:() => regShowPlan()},
         {key:'inspect', id:'reg-tab-inspect', panel:'reg-panel-gallery', icon:'grid', label:regT('inspect'), select:() => regInspect()}
       ])" @keydown="moveToolTab($event)"></nav>
  <div class="tool-notice" x-show="trainingActive" role="status">
    <span x-text="regT('trainingBlocked')"></span>
    <button type="button" class="btn btn-secondary btn-sm" @click="navigate('monitor-dashboard')"><span x-text="t('tagger.openMonitor')"></span><svg aria-hidden="true"><use href="#ti-external"></use></svg></button>
  </div>
  <div x-show="regTab === 'settings'" role="tabpanel" id="reg-panel-settings" aria-labelledby="reg-tab-settings" class="tool-batch-layout">
    <div class="reg-form tool-form-column">
      <fieldset class="tool-field-form" :disabled="regRunning || regBusy">
        <template id="regPromptFields"><div class="tool-field-grid" x-data="regPromptSizing()">
          <div class="field">
            <label class="field-key" for="regPositivePrompt" x-text="regT('extra_positive')"></label>
            <div class="field-input-row"><textarea id="regPositivePrompt" rows="3" :value="regSettings.extra_positive" @input="regSetField('extra_positive', $event.target.value)"></textarea></div>
            <p class="field-hint" x-text="regT('positiveHelp')"></p>
          </div>
          <div class="field">
            <label class="field-key" for="regNegativePrompt" x-text="regT('negative')"></label>
            <div class="field-input-row"><textarea id="regNegativePrompt" rows="3" :value="regSettings.negative" @input="regSetField('negative', $event.target.value)"></textarea></div>
          </div>
        </div></template>
        <div id="regTrainingControls"></div>
      </fieldset>
    </div>
    <aside class="reg-summary tool-action-panel">
      <h2 x-text="regT('plan')"></h2>
      <div class="tool-action-source" :class="{ready: regPlan && !regPreviewDirty}"><svg aria-hidden="true"><use href="#ti-folder"></use></svg><div><strong x-text="regSourceSummary()"></strong><span :title="regSettings.source_dir" x-text="regSettings.source_dir"></span></div></div>
      <template x-if="regPlan && (!regPlanConsumed || regPlanDirty) && !regPreviewDirty"><div class="reg-plan-summary">
        <div class="tool-source-summary"><span><strong x-text="regPlan.total"></strong><small x-text="regT('total')"></small></span><span :title="regPlanDirty ? regT('confirmOnGenerate') : ''"><strong x-text="regPlanDirty ? '—' : regPlan.completed"></strong><small x-text="regT('completed')"></small></span><span :title="regPlanDirty ? regT('confirmOnGenerate') : ''"><strong x-text="regPlanDirty ? '—' : regPlan.pending"></strong><small x-text="regT('pending')"></small></span></div>
        <p class="reg-help" x-show="regPlan.invalid_sources" x-text="regT('invalid') + ' ' + regPlan.invalid_sources + ' · ' + regT('skippedSourcesHelp')"></p>
        <p class="field-hint field-hint-warn" x-show="regPlan.candidate_selection_required" x-text="regT('candidateSelectionRequired')"></p>
        <p class="reg-help" x-text="regT('output')"></p><p class="reg-path" x-text="regPlanDirty ? regT('confirmOnGenerate') : regPlan.output_path"></p>
        <button type="button" class="btn btn-secondary btn-sm" x-show="regPlan.existing.length" @click="regShowPlan(); $nextTick(() => { const el = document.getElementById('regExistingResults'); el.open = true; el.scrollIntoView({block:'center',behavior:'smooth'}); })" x-text="regT('existing') + ' · ' + regPlan.existing.length"></button>
      </div></template>
      <div class="field" x-show="!regRunning && !regPlanConsumed && regPlan?.pending && regPlan?.existing.length"><div class="field-row"><div class="field-info"><div class="field-desc" x-text="regT('newRound')"></div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="regNewRound" @change="regChanged()" :disabled="regBusy" :aria-label="regT('newRound')"><span class="toggle-track"><span class="toggle-thumb"></span></span></label></div></div></div>
      <p class="reg-help" x-show="!regPlan && !regRunning" x-text="regT('emptyPlan')"></p>
      <button type="button" class="btn btn-start tool-action" x-show="!regRunning" :disabled="regBusy || trainingActive || regPlan?.candidate_selection_required > 0" @click="regGenerate()"><svg aria-hidden="true"><use href="#ti-play"></use></svg><span x-text="regBusy ? regT('working') : !regPlanDirty && (regPlanConsumed || regPlan?.total && !regPlan.pending) ? regT('again') : regT('start')"></span></button>
      <button type="button" class="btn btn-secondary tool-action" x-show="regTab === 'settings'" :disabled="regBusy" @click="regShowPlan()" x-text="regT('viewPlan')"></button>
      <button type="button" class="btn btn-stop tool-action" x-show="regRunning" :disabled="regBusy" @click="regStop()"><svg aria-hidden="true"><use href="#ti-stop"></use></svg><span x-text="regT('stop')"></span></button>
      <div class="tool-task-status" x-show="regTask && regTaskMatchesPlan">
        <div class="tool-task-title"><i :class="regStatusClass()"></i><strong x-text="regPhaseLabel()"></strong><span x-text="(regTask?.completed || 0) + ' / ' + (regTask?.total || 0)"></span></div>
        <div class="tool-progress-track" role="progressbar" :aria-label="regPhaseLabel()" :aria-valuenow="Math.round(regProgress)" aria-valuemin="0" aria-valuemax="100"><i :style="{width: regProgress + '%'}"></i></div>
        <div class="tool-task-file" :title="regTask?.output_path" x-text="regTask?.run_key"></div>
        <p class="reg-help" x-show="regTask?.failed" x-text="regT('failed') + ' ' + regTask?.failed"></p>
        <p class="reg-help" x-show="regRunning" :style="{visibility: regTask?.steps ? 'visible' : 'hidden'}" x-text="regT('steps') + ' ' + (regTask?.step || 0) + ' / ' + (regTask?.steps || 0)"></p>
      </div>
      <div class="reg-result-actions" x-show="regTaskMatchesPlan && regTask?.completed"><button type="button" class="btn btn-secondary tool-action" @click="regInspect()" x-text="regT('results')"></button><button type="button" class="btn btn-secondary tool-action" :disabled="regRunning || regBusy" @click="regUseForTraining()" x-text="regT('use')"></button></div>
      <p class="reg-help" x-show="regTaskMatchesPlan && !regRunning && regTask?.pending && regPlanDirty" x-text="regT('resumeDirty')"></p>
      <button type="button" class="btn btn-secondary tool-action" x-show="regTaskMatchesPlan && !regRunning && regTask?.pending" :disabled="regBusy || regPlanDirty || trainingActive" @click="regResume()" x-text="regT('resume')"></button>
      <button type="button" class="btn btn-secondary tool-action" x-show="regTaskMatchesPlan && !regRunning && regTask?.failed" :disabled="regBusy || regPlanDirty || trainingActive" @click="regResume(true)" x-text="regT('retry')"></button>
      <section class="tool-task-log" x-workspace-part="task-log" x-show="regTaskMatchesPlan && (regRunning || regLogs.length || regTask?.error)" :class="{expanded:regLogsOpen}"
               x-data="toolTaskLog(() => regWorkspaceLog(), () => regLogsOpen = !regLogsOpen, () => regCopyLogs())"></section>
    </aside>
  </div>
  <section class="reg-gallery" x-show="regTab !== 'settings'" role="tabpanel" id="reg-panel-gallery" :aria-labelledby="'reg-tab-' + regTab" x-data="regGallery()" @keydown.escape.window="closeDetail()" @scroll="if (!pinned) closeDetail()" @resize.window="closeDetail(); checkMore()">
    <div x-show="regTab === 'plan'">
      <div class="reg-toolbar">
        <span class="reg-help reg-plan-count" role="status" x-text="regPreviewDirty ? regT('awaitValidation') : regPlan ? regSourceSummary() + ' · ' + regT('total') + ' ' + regPlan.total : ''"></span><button type="button" class="btn btn-ghost btn-sm" :disabled="regBusy || regRunning" :title="regT('refreshPlanHelp')" :aria-busy="regBusy" @click="regScan()" x-text="regT('refreshPlan')"></button>
      </div>
      <p class="reg-help" x-show="!regPlan" x-text="regBusy ? regT('working') : regT('planEmpty')"></p>
      <template x-if="regPlan"><details id="regExistingResults" class="reg-existing" x-show="regPlan.existing.length"><summary x-text="regT('existing') + ' · ' + regPlan.existing.length"></summary><template x-for="result in regPlan.existing" :key="result.run_key"><p class="reg-path" x-text="result.run_key + ' · ' + regT('completed') + ' ' + result.completed"></p></template></details></template>
    </div>
    <div x-show="regTab === 'inspect'">
    <div class="reg-toolbar reg-inspection-toolbar">
      <div class="anima-select" x-data="animaSelect(() => regRunSelectConfig(), regRunKey)" x-effect="value = regRunKey" @click.outside="close()" @anima-select-change="regRunKey = $event.detail.value; regSelectRun()"><button type="button" class="anima-select-trigger" :class="{focused: open}" :aria-label="regT('chooseRun')" :disabled="regBusy || regRunning || !regRuns.length" @click="toggle($event)"><span class="anima-select-trigger-text" x-text="selectedLabel || regT('chooseRun')"></span><svg class="anima-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><template x-if="open" x-workspace-part="select-menu"></template></div>
      <div class="anima-select" x-data="animaSelect(() => regFilterSelectConfig(), regFilter)" x-effect="value = regFilter" @click.outside="close()" @anima-select-change="regFilter = $event.detail.value; regSelectFilter()"><button type="button" class="anima-select-trigger" :class="{focused: open}" :aria-label="regT('filterStatus')" :disabled="regBusy || !regRunKey" @click="toggle($event)"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><template x-if="open" x-workspace-part="select-menu"></template></div>
      <button class="btn btn-secondary" :disabled="regBusy" @click="regInspect()" x-text="regT('refresh')"></button>
      <div class="reg-inspection-actions" x-show="regRunKey"><button class="btn btn-primary btn-sm" :disabled="regBusy || regRunning || !regTask?.completed" @click="regUseForTraining()" x-text="regT('use')"></button><button class="btn btn-ghost btn-sm" :disabled="regBusy || regRunning" @click="regReadRunSettings()" x-text="regT('readSettings')"></button><button class="btn btn-ghost btn-sm" :disabled="regBusy || regRunning || trainingActive || !regTask?.completed" @click="regOpenTagEditor()" x-text="t('nav.tagEditor')"></button><button class="btn btn-secondary btn-sm" x-show="!regRunning && regTask?.pending" :disabled="regBusy || trainingActive" @click="regResume()" x-text="regT('resume')"></button><button class="btn btn-stop btn-sm" x-show="regRunning" :disabled="regBusy" @click="regStop()" x-text="regT('stop')"></button></div>
    </div>
    <div class="reg-inspection-path" x-show="regRunKey && regTask?.output_path"><span :title="regTask?.output_path" x-text="regTask?.output_path"></span><button type="button" class="btn btn-ghost btn-sm" @click="regCopyOutputPath()" x-text="t('common.copy')"></button></div>
    <div class="dashboard-empty" x-show="!regItems.length" role="status"><p x-text="regT(regRunKey ? 'noMatches' : 'noResults')"></p></div>
    </div>
    <div class="tool-gallery-grid reg-grid"><template x-for="card in regCards" :key="card.key"><article class="reg-result" :class="{excluded: !card.source && card.item.status === 'excluded'}" @mouseenter="if (card.source) showDetail(card.source, $event)" @mousemove="if (card.source && !pinned) moveDetail($event)" @mouseleave="if (!pinned) closeDetail()">
      <button type="button" class="tool-thumbnail reg-image-button" :class="{'is-source': !!card.source}" :aria-label="card.filename + ' · ' + regT(card.source ? 'captionDetails' : 'inspect')" x-show="card.image" @focus="if (card.source) showDetail(card.source, $event)" @blur="if (!pinned) closeDetail()" @click.stop="card.source ? showDetail(card.source, $event, true) : regSelected = card.item"><img :src="card.image" :alt="card.filename" loading="lazy" decoding="async"></button>
      <div class="reg-result-heading"><strong :title="card.source?.relative || card.filename" x-text="card.filename"></strong><span class="reg-help" x-text="card.label"></span></div>
      <p class="reg-result-caption" :title="card.caption" x-text="card.caption"></p>
      <p class="reg-help" x-text="card.source && regPreviewDirty ? regT('awaitValidation') : card.dimensions"></p>
      <p class="reg-error" x-show="card.error" x-text="card.error"></p>
      <div class="reg-actions" x-show="!card.source"><button class="btn btn-ghost btn-sm" x-show="card.item.status === 'completed'" :disabled="regRunning || regBusy || trainingActive" @click="regMutate(card.item, 'exclude')" x-text="regT('exclude')"></button><button class="btn btn-ghost btn-sm" x-show="card.item.status === 'excluded'" :disabled="regRunning || regBusy || trainingActive" @click="regMutate(card.item, 'restore')" x-text="regT('restore')"></button><button class="btn btn-ghost btn-sm" :title="regT('replaceHelp')" :disabled="regRunning || regBusy || trainingActive" @click="regMutate(card.item, 'regenerate')" x-text="regT('replaceImage')"></button></div>
    </article></template></div>
    <div class="reg-gallery-end" x-ref="galleryEnd" role="status" :aria-busy="regGalleryLoading === regTab">
      <span class="reg-help" x-show="regGalleryCount" x-text="regT('loadedImages').replace('{count}', regGalleryCount).replace('{total}', regGalleryTotal)"></span>
      <span class="reg-help" x-show="regGalleryLoading === regTab" x-text="regT('loading')"></span>
      <span class="reg-help" x-show="regMoreError" x-text="regMoreError"></span>
      <button type="button" class="btn btn-ghost btn-sm" x-show="regHasMore && regGalleryLoading !== regTab" :disabled="regBusy || regTab === 'plan' && regPreviewDirty" @click="regLoadMore()" x-text="regT(regMoreError ? 'retryLoad' : 'loadMore')"></button>
    </div>
    <template x-teleport="body"><div x-ref="sourceDetail" class="tool-popover reg-source-tooltip" x-show="detail" x-cloak :class="{'is-pinned': pinned}" :style="detailStyle" :role="pinned ? 'dialog' : 'tooltip'" :aria-label="regT('captionDetails')" @click.outside="if (pinned) closeDetail()">
      <div class="tool-popover-body">
        <div class="tool-popover-heading"><strong class="tool-popover-title" x-text="detail?.relative"></strong><button class="btn-icon reg-detail-close" @click="closeDetail()" :aria-label="regT('close')">×</button></div>
        <p class="reg-help" x-text="regPreviewDirty ? regT('awaitValidation') : (detail?.width || '—') + ' × ' + (detail?.height || '—') + ' · ' + regT('imageCount') + ' ' + (detail?.count || 0) + (regSettings.expand_repeats ? ' · ' + regT('repeats') + ' ' + detail?.repeats : '')"></p>
        <template x-for="entry in [{label:'original', text:detail?.original_caption}, {label:'caption', text:detail?.caption}, {label:'prompt', text:detail?.prompt}, {label:'negative', text:regSettings.negative}]" :key="entry.label"><div class="reg-source-detail-field"><span class="tool-popover-label" x-text="regT(entry.label)"></span><p x-text="entry.text || '—'"></p></div></template>
        <p class="reg-error" x-show="detail?.reason" x-text="regReasonText(detail)"></p>
        <span class="reg-help reg-detail-pin-hint" x-text="regT('pinDetails')"></span>
      </div>
    </div></template>
  </section>
  <dialog id="reg-source-help" class="modal-overlay" x-dialog="regSourceHelpOpen" @click.self="regSourceHelpOpen = false" @dialog-close="regSourceHelpOpen = false" aria-labelledby="reg-source-help-title">
    <div class="modal modal-workbench parameter-doc-modal reg-source-help">
      <header class="modal-header">
        <span id="reg-source-help-title" x-text="regT('sourceFolderRules')"></span>
        <button type="button" class="btn-icon" data-dialog-autofocus @click="regSourceHelpOpen = false" :aria-label="regT('close')">×</button>
      </header>
      <div class="modal-body markdown-body" tabindex="0">
        <h3 x-text="regT('sourceHelp.folderTitle')"></h3>
        <ul>
          <li x-text="regT('sourceHelp.folderDirect')"></li>
          <li x-text="regT('sourceHelp.folderTraining')"></li>
          <li x-text="regT('sourceHelp.folderDisabled')"></li>
        </ul>
        <h3 x-text="regT('sourceHelp.captionTitle')"></h3>
        <ul>
          <li x-text="regT('sourceHelp.captionRead')"></li>
          <li x-text="regT('sourceHelp.captionSkip')"></li>
        </ul>
      </div>
    </div>
  </dialog>
  <dialog class="modal-overlay" x-dialog="!!regSelected" @click.self="regSelected = null" @dialog-close="regSelected = null" aria-labelledby="reg-preview-image-title">
    <template x-if="regSelected">
      <div class="modal modal-workbench reg-image-modal">
        <header class="modal-header">
          <span id="reg-preview-image-title" :title="regSelected.filename" x-text="regSelected.filename"></span>
          <div class="reg-preview-actions">
            <button type="button" class="btn btn-ghost btn-sm" :disabled="regBusy || !regCanNavigateImage(-1)" @click="regNavigateImage(-1)" x-text="regT('previousImage')"></button>
            <button type="button" class="btn btn-ghost btn-sm" :disabled="regBusy || !regCanNavigateImage(1)" @click="regNavigateImage(1)" x-text="regT('nextImage')"></button>
            <button type="button" class="btn-icon" data-dialog-autofocus @click="regSelected = null" :aria-label="regT('close')">×</button>
          </div>
        </header>
        <div class="modal-body" tabindex="0">
          <img x-image="{src: regImage(regSelected, 'original'), placeholder: regImage(regSelected)}" :alt="regSelected.caption">
          <p><span x-text="regT('caption')"></span>: <span x-text="regSelected.caption"></span></p>
          <p><span x-text="regT('prompt')"></span>: <span x-text="regSelected.prompt"></span></p>
          <p class="reg-help" x-text="regSelected.width + ' × ' + regSelected.height + ' · ' + regT('seed') + ' ' + regSelected.seed"></p>
          <p class="reg-help" x-text="regSelected.relative"></p>
        </div>
      </div>
    </template>
  </dialog>
</div>
