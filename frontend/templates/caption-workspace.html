<div class="caption-workspace" :class="{'caption-is-overview':currentRoute === 'ai-captioning' && captionTab === 'overview','caption-is-single':currentRoute === 'ai-captioning' && captionTab === 'single'}" x-show="currentRoute === 'ai-captioning'">
  <nav class="tagger-mode-tabs caption-workspace-tabs" role="tablist" :aria-label="t('moss.pageTitle')" @keydown="captionTabKey($event)" x-effect="captionTab; locale; $nextTick(() => _syncTaggerTabIndicator('.caption-workspace-tabs'))" @resize.window.debounce.100ms="_syncTaggerTabIndicator('.caption-workspace-tabs')">

    <div class="tagger-single-main caption-single-main" x-show="captionTab === 'single'">
      <main class="tagger-single-preview" :class="{'drag-over':taggerDragOver,empty:!taggerSource}" @dragover.prevent="taggerDragOver = true" @dragleave="if (!$el.contains($event.relatedTarget)) taggerDragOver = false" @drop.prevent="handleTaggerDrop($event)">
        <div class="tagger-preview-toolbar" x-show="taggerSource"><span x-text="taggerSource?.display_name || taggerSource?.path"></span><button type="button" @click="resetTaggerPreview()" :title="t('tagger.fit')" :aria-label="t('tagger.fit')"><svg><use href="#ti-fit"></use></svg></button></div>
        <button type="button" class="tagger-drop-zone" x-show="!taggerSource" :disabled="captionPreviewBusy" @click="document.getElementById('taggerFileInput').click()"><svg><use href="#ti-image"></use></svg><strong x-text="t('tagger.dropImageHere')"></strong><span x-text="t('tagger.orPaste')"></span></button>
        <div class="tagger-preview-image" x-data="{imageFailed:false}" x-effect="taggerSource?.source_token; imageFailed = false" x-show="taggerSource" :class="{zoomed:taggerPreviewScale > 1,panning:taggerPreviewPanning}" @wheel.prevent="zoomTaggerPreview($event)" @pointerdown="startTaggerPreviewPan($event)" @pointermove="moveTaggerPreviewPan($event)" @pointerup="stopTaggerPreviewPan($event)" @pointercancel="stopTaggerPreviewPan($event)" @dblclick="resetTaggerPreview()"><img x-show="!imageFailed" :src="captionTab === 'single' ? taggerPreviewUrl(0) : ''" :style="taggerPreviewTransform()" :alt="t('tagger.preview')" @load="resetTaggerPreview()" @error="imageFailed = true" draggable="false"><span class="caption-image-fallback" x-show="imageFailed" role="status" x-text="t('caption.imageUnavailable')"></span></div>
      </main>
      <div class="caption-single-actions">
        <button type="button" class="btn btn-secondary btn-sm" :disabled="captionPreviewBusy || taggerScanning" @click="document.getElementById('taggerFileInput').click()"><svg><use href="#ti-image"></use></svg><span x-text="t('caption.chooseImage')"></span></button>
        <button type="button" class="btn btn-secondary btn-sm caption-browse-image" x-show="localPickerAvailable" :disabled="captionPreviewBusy || taggerScanning" @click="pickTaggerSource()" :title="t('common.browse')" :aria-label="t('common.browse')"><svg><use href="#ti-folder"></use></svg></button>
        <button type="button" class="tagger-secondary-button tagger-clear-button" :disabled="!taggerSource || captionPreviewBusy || taggerScanning" @click="clearTaggerSource()" x-text="t('common.clear')"></button>
        <button type="button" class="tagger-start-button" x-show="!captionPreviewBusy" :disabled="!captionPreviewCanStart()" @click="startCaptionPreview()"><svg><use href="#ti-play"></use></svg><span x-text="t(captionSingleResult || captionPreviewError ? 'caption.retryPreview' : 'caption.startPreview')"></span></button>
        <button type="button" class="tagger-stop-button" x-show="captionPreviewBusy" :disabled="captionPreviewCancelling" @click="cancelCaptionPreview()" x-text="t(captionPreviewCancelling ? 'caption.settling' : 'tagger.stop')"></button>
      </div>
      <p class="field-hint" x-text="t('caption.previewNoWrite')"></p>
      <p class="field-hint" role="status" x-show="taggerScanning" x-text="t('caption.loading')"></p>
      <p class="field-hint" x-show="taggerSource && !captionPreviewBusy && captionPreviewStartHint()" x-text="captionPreviewStartHint()"></p>
      <p class="field-hint field-hint-warn" x-show="captionBatchRunning() || captionExternalTaggerBusy && !captionPreviewBusy" x-text="t('caption.previewTaggerBusy')"></p>
      <section class="tagger-form-card caption-candidate-viewer" :aria-busy="String(captionPreviewBusy)" x-data="captionCandidateViewer(() => captionSingleResult)">
        <header class="caption-viewer-heading"><h2 x-text="t('caption.previewResult')"></h2><button class="btn btn-secondary btn-sm" :disabled="!captionViewerText()" @click="captionViewerCopy()"><svg><use href="#ti-copy"></use></svg><span x-text="t('caption.copy')"></span></button></header>
        <div class="caption-candidate-tabs" :aria-label="t('caption.previewCandidates')"><template x-for="name in captionViewerNames()" :key="name"><button type="button" :class="{active:(captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name}" :aria-pressed="String((captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name)" @click="candidate = name" x-text="t('moss.candidate_' + name)"></button></template></div>
        <div class="caption-candidate-text" tabindex="0" x-show="captionViewerText()" x-text="captionViewerText()"></div><div class="dashboard-empty caption-empty" :class="{'caption-result-error':!!captionPreviewError}" :role="captionPreviewError ? 'alert' : 'status'" x-show="!captionViewerText()" x-text="captionPreviewError || t(captionPreviewBusy ? captionPreviewCancelling ? 'caption.cancelWait' : 'caption.previewLoading' : 'caption.noPreviewResult')"></div>
        <details x-show="captionSingleResult"><summary class="card-header"><span x-text="t('caption.promptAndRaw')"></span><svg class="card-chevron"><use href="#ti-chevron"></use></svg></summary><pre x-text="captionSingleResult?.prompt"></pre><pre x-text="captionSingleResult?.raw"></pre><small x-text="captionSingleResult ? captionSingleResult.model + ' · ' + t('tagger.etaSeconds').replace('{seconds}', captionSingleResult.elapsed) + ' · ' + captionSingleResult.attempts + ' ' + t('caption.attempts') : ''"></small></details>
      </section>
    </div>
    <div class="tagger-single-divider" x-show="captionTab === 'single'" :class="{dragging:taggerSingleResizing}" role="separator" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="70" :aria-valuenow="taggerSingleLeftWidth" :aria-label="t('tagger.resizePanels')" tabindex="0" @pointerdown.prevent="startTaggerSingleResize($event)" @keydown.left.prevent="taggerSingleLeftWidth = Math.max(30,taggerSingleLeftWidth - 1)" @keydown.right.prevent="taggerSingleLeftWidth = Math.min(70,taggerSingleLeftWidth + 1)"></div>

    <main class="caption-settings-column" :class="captionTab === 'single' ? 'tagger-single-sidebar' : 'tagger-form-column'">
      <fieldset class="caption-settings caption-form" :disabled="captionBatchRunning() || captionPreviewBusy || taggerStarting" @change="saveCaptionOptions()">
        <section class="caption-form-section caption-input-section" x-show="captionTab === 'batch'">
          <h2 class="caption-section-heading" x-text="t('caption.inputReference')"></h2>
          <div class="caption-section-body caption-input-fields">
          <div class="field caption-folder-field"><div class="field-row"><div class="field-info"><label class="field-key" for="caption-folder" x-text="t('tagger.imageDir')"></label><div class="field-desc" id="caption-folder-help" x-text="t(captionOffline() ? 'caption.imageDirExportHelp' : 'caption.imageDirHelp')"></div></div><div class="field-control caption-path-control"><div class="field-input-wrap"><input id="caption-folder" type="text" aria-describedby="caption-folder-help caption-folder-error" :aria-invalid="String(!!captionSourceError)" :placeholder="t('tagger.sourcePath')" x-model="taggerSourcePath" spellcheck="false" @input="scheduleTaggerSourceScan()" @keydown.enter.prevent="scanTaggerSource()"><div class="field-input-actions"><button type="button" class="btn-icon" x-show="localPickerAvailable" @click="pickTaggerSource()" :aria-label="t('common.browse')"><svg><use href="#ti-folder"></use></svg></button></div></div></div></div></div>

          <div class="caption-input-options">
          <div class="field"><div class="field-row"><div class="field-info"><label class="field-key" x-text="t('caption.task')"></label></div><div class="field-control">
            <div class="anima-select" x-data="animaSelect(() => captionTaskConfig(),captionOptions.mode)" x-effect="value = captionOptions.mode" @click.outside="close()" @anima-select-change="setCaptionTaskMode($event.detail.value)">
              <button type="button" class="anima-select-trigger" :class="{focused:open}" @click="toggle($event)" :aria-label="t('caption.task')"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{open:open}"><use href="#ti-chevron"></use></svg></button>
              <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{'anima-select-menu-positioned':positioned}"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{active:opt.v === value}" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
            </div>
          </div></div></div>
          <div class="field caption-reference-field" x-show="!captionOffline()"><div class="field-row"><div class="field-info"><label class="field-key" for="caption-reference" x-text="t('caption.referenceFiles')"></label></div><div class="field-control"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" id="caption-reference" placeholder=".txt" aria-describedby="caption-reference-help caption-reference-storage" x-model="captionOptions.reference_extension" spellcheck="false"></div></div></div>
          </div>
          <div class="caption-reference-notes" x-show="!captionOffline()"><p id="caption-reference-help" class="field-hint" x-text="t('caption.referenceFilesHelp')"></p><p id="caption-reference-storage" class="field-hint" :class="{'field-hint-warn':captionOptions.overwrite}" x-text="t('caption.referenceStorageHelp')"></p></div>
          </div>
        </section>

        <section class="caption-form-section caption-prompt-settings" x-show="captionTab === 'single' || !captionOffline()">
          <h2 class="caption-section-heading" x-text="t('caption.promptSettings')"></h2>
          <div class="caption-section-body">
            <div class="field caption-prompt-source" :class="{'field-changed':captionFieldChanged('options','prompt_source')}"><div class="field-row"><div class="field-info"><label class="field-key" x-text="t('caption.promptSource')"></label></div><div class="field-control"><div class="anima-select" x-data="animaSelect(() => captionPromptConfig(),captionOptions.prompt_source)" x-effect="value = captionOptions.prompt_source" @click.outside="close()" @anima-select-change="setCaptionPromptSource($event.detail.value)"><button type="button" class="anima-select-trigger" :class="{focused:open}" @click="toggle($event)" :aria-label="t('caption.promptSource')"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{open:open}"><use href="#ti-chevron"></use></svg></button><template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{'anima-select-menu-positioned':positioned}"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{active:opt.v === value}" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-show="opt.d" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template></div></div><div class="caption-field-actions" x-html="captionFieldMenu('options','prompt_source')"></div></div></div>
            <div class="caption-prompt-preview" x-show="captionOptions.prompt_source === 'default'"><p x-text="t('caption.builtinPromptHelp')"></p><button type="button" class="caption-text-button" @click="showCaptionDefaultPrompt()" x-text="t('caption.viewTemplate')"></button></div>
            <textarea autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" x-show="captionOptions.prompt_source === 'text'" rows="8" x-model="captionOptions.prompt_text" :aria-label="t('caption.customPrompt')"></textarea>
            <div class="field-input-wrap" x-show="captionOptions.prompt_source === 'file'"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" x-model="captionOptions.prompt_file" :aria-label="t('moss.prompt_file')" spellcheck="false"><div class="field-input-actions"><button type="button" class="btn-icon" x-show="localPickerAvailable" @click="pickCaptionPath('prompt_file')" :aria-label="t('common.browse')"><svg><use href="#ti-folder"></use></svg></button></div></div><p class="field-hint" x-show="captionOptions.prompt_source !== 'default'" x-text="t('caption.templateHelp')"></p>
          </div>
        </section>
        <section class="caption-form-section caption-knowledge" x-show="captionTab === 'single' || !captionOffline()">
          <h2 class="caption-section-heading" x-text="t('caption.optionalKnowledge')"></h2>
          <div class="caption-section-body">
          <div class="field" :class="{'field-changed':captionFieldChanged('options','knowledge')}"><div class="field-row"><div class="field-info"><label class="field-key" for="caption-knowledge" x-text="t('moss.knowledge')"></label><div class="field-desc" x-text="t('caption.knowledgeHelp')"></div></div><div class="field-control"><textarea autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" id="caption-knowledge" rows="3" x-model="captionOptions.knowledge" :placeholder="t('moss.knowledge_placeholder')"></textarea></div><div class="caption-field-actions" x-html="captionFieldMenu('options','knowledge')"></div></div></div>
          <div class="field" :class="{'field-changed':captionFieldChanged('options','knowledge_file')}"><div class="field-row"><div class="field-info"><label class="field-key" for="caption-knowledge-file" x-text="t('moss.knowledge_file')"></label><div class="field-desc" x-text="t('moss.knowledge_file_help')"></div></div><div class="field-control caption-path-control"><div class="field-input-wrap"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" id="caption-knowledge-file" x-model="captionOptions.knowledge_file" spellcheck="false"><div class="field-input-actions"><button type="button" class="btn-icon" x-show="localPickerAvailable" @click="pickCaptionPath('knowledge_file')" :aria-label="t('common.browse')"><svg><use href="#ti-folder"></use></svg></button></div></div></div><div class="caption-field-actions" x-html="captionFieldMenu('options','knowledge_file')"></div></div></div>
          <div class="caption-knowledge-rules" x-show="captionTab === 'batch'"><h3 x-text="t('caption.knowledgeRules')"></h3><p class="field-hint" x-text="t('moss.knowledge_help')"></p><div class="caption-parameter-grid"><template x-for="key in ['dir_knowledge_name','knowledge_suffix']" :key="key"><div class="field" :class="{'field-changed':captionFieldChanged('options',key)}"><div class="field-row"><div class="field-info"><label class="field-key" :for="'caption-' + key" x-text="t('moss.' + key)"></label><div class="field-desc" x-text="t('moss.' + key + '_help')"></div></div><div class="field-control"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" :id="'caption-' + key" x-model="captionOptions[key]" spellcheck="false"></div><div class="caption-field-actions" x-html="captionFieldMenu('options',key)"></div></div></div></template></div></div>
          <p class="field-hint" x-show="captionTab === 'single'" x-text="t('caption.singleKnowledge')"></p>
          </div>
        </section>
        <section class="caption-form-section caption-connection" x-show="captionTab === 'single' || !captionOffline()">
          <h2 class="caption-section-heading" x-text="t('caption.modelPrompt')"></h2>
          <div class="caption-section-body caption-connection-fields" @input="syncTaggerApiConnection()">
          <div class="field"><div class="field-row"><div class="field-info"><label class="field-key" x-text="t('tagger.apiProtocol')"></label></div><div class="field-control"><div class="anima-select" x-data="animaSelect(() => captionProtocolConfig(),taggerApiSettings.protocol)" x-effect="value = taggerApiSettings.protocol" @click.outside="close()" @anima-select-change="taggerApiSettings.protocol = $event.detail.value; saveCaptionOptions()"><button type="button" class="anima-select-trigger" :class="{focused:open}" @click="toggle($event)" :aria-label="t('tagger.apiProtocol')"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{open:open}"><use href="#ti-chevron"></use></svg></button><template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{'anima-select-menu-positioned':positioned}"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{active:opt.v === value}" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-show="opt.d" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template></div></div></div></div>
          <template x-for="field in [{key:'baseUrl',label:'tagger.apiBaseUrl',help:'caption.apiHelp'},{key:'apiKey',label:'tagger.apiKey',help:'caption.keyHelp'}]" :key="field.key"><div class="field"><div class="field-row"><div class="field-info"><label class="field-key" :for="'caption-api-' + field.key" x-text="t(field.label)"></label><div class="field-desc" x-text="t(field.help)"></div></div><div class="field-control caption-path-control"><div class="field-input-wrap"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" class="tagger-text-input" :id="'caption-api-' + field.key" :type="field.key === 'apiKey' && !taggerApiShowKey ? 'password' : 'text'" x-model="taggerApiSettings[field.key]" spellcheck="false"><div class="field-input-actions" x-show="field.key === 'apiKey'"><button type="button" class="btn-icon" @click="taggerApiShowKey = !taggerApiShowKey" :aria-label="t(taggerApiShowKey ? 'tagger.apiKeyHide' : 'tagger.apiKeyShow')"><svg><use :href="taggerApiShowKey ? '#ti-eye-off' : '#ti-eye'"></use></svg></button></div></div></div></div></div></template>
          <div class="field">
            <div class="field-row"><div class="field-info"><label class="field-key" for="caption-model" x-text="t('tagger.apiModelName')"></label></div>
              <div class="field-control caption-path-control"><div class="caption-model-row">
                <div class="anima-select" x-data="animaSelect(() => taggerApiModelConfig(),taggerApiSettings.model)" x-effect="value = taggerApiSettings.model" @click.outside="close()" @anima-select-change="taggerApiSettings.model = $event.detail.value; saveCaptionOptions()">
                  <div class="anima-select-trigger tagger-api-model-combo" :class="{focused:open}"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" id="caption-model" class="tagger-text-input" :placeholder="t('caption.modelPlaceholder')" x-model="taggerApiSettings.model" spellcheck="false"><button type="button" class="tagger-api-model-chevron" :disabled="!taggerApiModelSuggestions.length" @click="toggle($event)" :aria-label="t('caption.modelList')"><svg class="anima-select-chevron" :class="{open:open}"><use href="#ti-chevron"></use></svg></button></div>
                  <template x-if="open"><div class="anima-select-menu tagger-api-model-menu" :class="{'anima-select-menu-positioned':positioned}"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{active:opt.v === value}" @click="select(opt.v)"><span class="anima-select-option-label" x-text="opt.l"></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>

              </div></div>
            </div><span class="tagger-api-test-result" :class="taggerApiTestInfo.state" x-show="taggerApiTestInfo.text" x-text="taggerApiTestInfo.text"></span>
          </div>
          </div>
        </section>
        <section class="caption-form-section caption-output-section">
          <h2 class="caption-section-heading caption-candidate-heading"><span x-text="t(captionTab === 'single' ? 'caption.previewCandidates' : 'caption.outputCandidates')"></span><span x-html="captionFieldMenu('options','candidates')"></span></h2>
          <div class="caption-section-body">
          <p class="field-hint" x-show="captionTab === 'batch'" x-text="t(captionOffline() ? 'caption.exportCandidatesHelp' : 'caption.candidatesHelp')"></p>
          <div class="caption-candidate-order" role="group" :aria-label="t(captionTab === 'single' ? 'caption.previewCandidates' : 'caption.fileCandidates')">
            <template x-for="name in captionCandidateRows(captionTab === 'single')" :key="name"><div class="field" :class="{'field-changed':!captionOptions.candidates.includes(name)}">
              <label class="caption-candidate-label" :for="'caption-candidate-' + name" x-text="t('moss.candidate_' + name)"></label>
              <div class="caption-candidate-controls"><label class="toggle"><input :id="'caption-candidate-' + name" type="checkbox" :checked="captionOptions.candidates.includes(name)" @change="toggleCaptionCandidate(name,$event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></label></div>
            </div></template>
          </div>
          <div class="caption-file-settings" x-show="captionTab === 'batch'">
            <h3 x-text="t('caption.fileSettings')"></h3>
            <div class="caption-parameter-grid"><template x-for="field in [{key:'caption_extension',label:'moss.caption_extension'},{key:'sidecar_suffix',label:'moss.sidecar_suffix',help:captionOffline() ? 'caption.exportRecordHelp' : 'moss.sidecar_suffix_help'},{key:'separator',label:'moss.separator',help:'moss.separator_help'}]" :key="field.key"><div class="field" :class="{'field-changed':captionFieldChanged('options',field.key)}"><div class="field-row"><div class="field-info"><label class="field-key" :for="'caption-output-' + field.key" x-text="t(field.label)"></label><div class="field-desc" x-show="field.help" x-text="field.help ? t(field.help) : ''"></div></div><div class="field-control"><input autocomplete="off" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" type="text" :id="'caption-output-' + field.key" x-model="captionOptions[field.key]" spellcheck="false"></div><div class="caption-field-actions" x-html="captionFieldMenu('options',field.key)"></div></div></div></template></div>
          </div>

          </div>

          <nav class="caption-review-sections" role="tablist" :aria-label="t('caption.detailSections')" @keydown="captionReviewTabKey($event)"><template x-for="view in ['caption','context','record']" :key="view"><button type="button" role="tab" :id="'caption-review-tab-' + view" aria-controls="caption-review-panel" :class="{active:captionDetailView === view}" :aria-selected="String(captionDetailView === view)" :tabindex="captionDetailView === view ? 0 : -1" @click="captionDetailView = view" x-text="t('caption.detail_' + view)"></button></template></nav>
          <div class="caption-review-candidates" x-show="captionDetailView === 'caption'"><div class="caption-candidate-tabs" role="group" :aria-label="t('caption.previewCandidates')"><template x-for="name in captionViewerNames()" :key="name"><button type="button" :class="{active:(captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name}" :aria-pressed="String((captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name)" @click="candidate = name" x-text="t('moss.candidate_' + name)"></button></template></div><button class="btn btn-secondary btn-sm caption-copy-button" :disabled="captionDetailLoading || !captionViewerText()" @click="captionViewerCopy()" :title="t('caption.copy')" :aria-label="t('caption.copy')"><svg><use href="#ti-copy"></use></svg><span x-text="t('caption.copy')"></span></button></div>
          <div class="caption-review-scroll" id="caption-review-panel" role="tabpanel" tabindex="0" :aria-labelledby="'caption-review-tab-' + captionDetailView" :aria-busy="String(captionDetailLoading)" x-effect="captionOverviewDetail?.path; captionViewerText(); captionDetailView; $nextTick(() => captionViewerReveal($el))">
            <p class="caption-review-loading" role="status" x-show="captionDetailLoading" x-text="t('caption.loading')"></p>
            <p class="caption-review-error" role="alert" x-show="captionDetailError || captionOverviewDetail?.read_error || captionOverviewDetail?.sidecar_error" x-text="captionDetailError || captionOverviewDetail?.read_error || captionOverviewDetail?.sidecar_error"></p>
            <div class="caption-candidate-text" x-show="!captionDetailLoading && captionDetailView === 'caption'" x-text="captionViewerText() || t('caption.noCaptionText')"></div>
            <div class="caption-review-context" x-show="!captionDetailLoading && captionDetailView === 'context'"><template x-for="section in [{label:'caption.promptSource',text:captionOverviewDetail?.sidecar?.prompt},{label:'caption.referenceText',text:captionOverviewDetail?.reference},{label:'caption.optionalKnowledge',text:captionOverviewDetail?.sidecar?.knowledge}]" :key="section.label"><section x-show="section.text"><h3 x-text="t(section.label)"></h3><pre x-text="section.text"></pre></section></template><p class="field-hint" x-show="!captionOverviewDetail?.sidecar?.prompt && !captionOverviewDetail?.reference && !captionOverviewDetail?.sidecar?.knowledge" x-text="t('caption.noContext')"></p></div>
            <div x-show="!captionDetailLoading && captionDetailView === 'record'"><pre x-show="captionOverviewDetail?.sidecar" x-text="JSON.stringify(captionOverviewDetail?.sidecar || {},null,2)"></pre><p class="field-hint" x-show="!captionOverviewDetail?.sidecar" x-text="t('caption.noRecord')"></p></div>
          </div>
          <footer class="caption-review-footer"><span x-text="captionDetailView === 'caption' && !captionDetailLoading && captionViewerText() ? captionViewerText().length.toLocaleString() + ' ' + t('caption.characters') : ''"></span><button class="btn btn-secondary btn-sm" :disabled="captionDetailLoading || !captionEditorAvailable() || captionBatchRunning()" :title="!captionEditorAvailable() ? t('caption.editorTxtOnly') : ''" @click="openCaptionEditor(captionOverviewDetail)"><svg><use href="#ti-external"></use></svg><span x-text="t('caption.editThisCaption')"></span></button></footer>
        </section>
      </div>
    </div>
  </dialog>
  <dialog class="modal-overlay caption-prompt-dialog" x-dialog="captionPromptOpen" @click.self="captionPromptOpen = false" @dialog-close="captionPromptOpen = false" :aria-label="t('caption.promptSettings')"><div class="modal modal-workbench"><header class="caption-viewer-heading"><h2 x-text="captionCheckPromptPath ? t('caption.effectivePrompt') : t('caption.defaultPrompt')"></h2><button class="btn btn-secondary btn-sm" data-dialog-autofocus @click="captionPromptOpen = false" x-text="t('common.close')"></button></header><p class="caption-detail-path" x-show="captionCheckPromptPath" x-text="captionCheckPromptPath"></p><pre tabindex="0" x-text="captionCheckPrompt"></pre></div></dialog>
</div>
