      <div class="tagger-single-actions"><button type="button" class="tagger-start-button" x-show="!captionPreviewBusy" :disabled="!captionPreviewCanStart()" @click="startCaptionPreview()"><svg><use href="#ti-play"></use></svg><span x-text="t(captionSingleResult || captionPreviewError ? 'caption.retryPreview' : 'caption.startPreview')"></span></button><button type="button" class="tagger-stop-button" x-show="captionPreviewBusy" :disabled="captionPreviewCancelling" @click="cancelCaptionPreview()" x-text="t(captionPreviewCancelling ? 'caption.settling' : 'tagger.stop')"></button><button class="tagger-secondary-button tagger-clear-button" :disabled="!taggerSource || captionPreviewBusy || taggerScanning" @click="clearTaggerSource()" x-text="t('common.clear')"></button></div>

        <section class="card">

          <div x-show="captionTab === 'batch'">

            <p class="field-hint" x-text="t('caption.orderHelp')"></p>
            <pre class="caption-output-skeleton" x-text="captionOutputSkeleton()"></pre>
            <template x-for="field in [{key:'caption_extension',label:'moss.caption_extension'},{key:'sidecar_suffix',label:'moss.sidecar_suffix',help:captionOffline() ? 'caption.exportRecordHelp' : 'moss.sidecar_suffix_help'},{key:'separator',label:'moss.separator',help:'moss.separator_help'}]" :key="field.key"><div class="field"><div class="field-row"><div class="field-info"><label class="field-key" :for="'caption-output-' + field.key" x-text="t(field.label)"></label><div class="field-desc" x-show="field.help" x-text="field.help ? t(field.help) : ''"></div></div><div class="field-control"><input type="text" :id="'caption-output-' + field.key" x-model="captionOptions[field.key]" spellcheck="false"></div></div></div></template>
            <p class="field-hint caption-output-example" x-text="captionOutputExample()"></p><p class="field-hint" x-text="t('caption.trainingHelp')"></p>
          </div>
        </section>
      </fieldset>
    </main>

    <aside class="tagger-action-panel" x-show="captionTab === 'batch'">
      <h2 x-text="t('caption.run')"></h2>
      <div class="tagger-action-source" :class="{ready:taggerSource?.total}"><svg><use href="#ti-folder"></use></svg><div><strong x-text="taggerSource?.total ? taggerSource.total + ' ' + t('tagger.images') : t('tagger.noSource')"></strong><span x-text="taggerSource?.path || t('caption.selectDirectory')"></span></div></div>
      <div class="caption-policy-options" role="group" :aria-label="t('caption.writePolicy')"><template x-for="overwrite in [false,true]" :key="String(overwrite)"><button type="button" :class="{active:captionOptions.overwrite === overwrite}" :aria-pressed="String(captionOptions.overwrite === overwrite)" :disabled="captionBatchRunning() || taggerStarting" @click="captionOptions.overwrite = overwrite; saveCaptionOptions()"><strong x-text="overwrite ? captionOverwriteLabel() : t('caption.onlyMissing')"></strong><span x-text="t('caption.policy_' + captionOptions.mode + '_' + (overwrite ? 'overwrite' : 'missing'))"></span></button></template></div>
      <div class="caption-plan-counts" x-show="captionOverviewPlan"><template x-for="key in ['requests','reused','skipped','writes']" :key="key"><span><strong x-text="t('caption.imageCount').replace('{count}',captionOverviewPlan?.[key] || 0)"></strong><small x-text="t('caption.plan_' + key)"></small></span></template></div>
      <p class="field-hint" x-show="captionOverviewPlan" x-text="t('caption.planHelp')"></p>
      <p class="field-hint field-hint-warn" x-show="captionReferenceWillBeSkipped()" x-text="t('caption.referenceSkipped')"></p>
      <p class="field-hint field-hint-warn" x-show="captionPlanError" role="alert" x-text="captionPlanError"></p>
      <button class="tagger-start-button" x-show="!taggerRunning" :disabled="!taggerApiCanStart()" @click="startApiTagger()"><svg><use href="#ti-play"></use></svg><span x-text="taggerStarting ? t('common.starting') : t('caption.task_' + captionOptions.mode)"></span></button>
      <button class="tagger-stop-button" x-show="taggerRunning" :disabled="taggerTask?.status === 'cancelling'" @click="cancelTagger()"><svg><use href="#ti-stop"></use></svg><span x-text="t('tagger.stop')"></span></button>
      <button class="tagger-secondary-button" :disabled="!captionCanCheck()" @click="startApiTagger(true)" :title="t('caption.precheckHelp')" x-text="t('caption.precheck')"></button>
      <p class="field-hint" x-show="!taggerRunning && captionStartHint()" x-text="captionStartHint()"></p>
      <p class="field-hint" x-show="taggerRunning" x-text="t('caption.cancelHelp')"></p>
      <div class="tagger-task-status" x-show="taggerTask"><div class="tagger-task-title"><i :class="taggerTask?.status"></i><strong x-text="taggerPhaseLabel()"></strong><span x-text="taggerTaskProgressText()"></span></div><div class="tagger-progress-track"><i :style="'width:' + taggerProgressPercent() + '%'"></i></div><div class="tagger-task-file" x-text="taggerTask?.current_file"></div><dl><template x-for="key in ['written','reused','checked','skipped','failed']" :key="key"><div><dt x-text="t('caption.actual_' + key)"></dt><dd :class="{failed:key === 'failed'}" x-text="taggerTask?.[key] || 0"></dd></div></template></dl></div>
      <p class="field-hint" x-show="taggerTask?.caption_options?.dry_run" x-text="t('caption.precheckReadiness').replace('{failed}',taggerTask?.failed || 0).replace('{checked}',taggerTask?.checked || 0)"></p>
      <p class="field-hint field-hint-warn" x-show="captionPrecheckStale()" x-text="t('caption.precheckStale')"></p>
      <button class="tagger-secondary-button" x-show="taggerTask?.has_check_prompt" @click="showCaptionCheckPrompt()" x-text="t('caption.effectivePrompt')"></button>
      <button class="tagger-secondary-button" x-show="taggerTask?.failed" :disabled="taggerRunning || taggerStarting" @click="retryFailedTagger()"><svg><use href="#ti-retry"></use></svg><span x-text="t('tagger.retryFailed')"></span></button>
      <button class="tagger-secondary-button" x-show="taggerSource" @click="selectCaptionTab('overview')" x-text="t('caption.viewOverview')"></button>
      <section class="tagger-action-log" x-show="taggerTask" :class="{expanded:taggerLogsOpen}"><header><div><strong x-text="t('tagger.logTitle')"></strong><span class="tagger-log-phase" :class="{running:taggerRunning}" x-text="taggerPhaseLabel()"></span></div><button type="button" @click="taggerLogsOpen = !taggerLogsOpen" x-text="t(taggerLogsOpen ? 'common.collapse' : 'common.expand')"></button></header><div class="tagger-error-summary" x-show="taggerTask?.error_detail" x-text="taggerTask?.error_detail"></div><div class="tagger-log-stream" x-data="{follow:true}" @scroll="follow = $el.scrollHeight - $el.scrollTop - $el.clientHeight < 24" x-effect="taggerTask?.logs; $nextTick(() => {if (follow) $el.scrollTop = $el.scrollHeight})"><template x-for="(line,index) in taggerVisibleLogs()" :key="index"><div class="tagger-log-line" :class="line.level"><time class="tagger-log-time" x-text="line.time"></time><code class="tagger-log-message" x-text="taggerLogMessage(line)"></code></div></template></div></section>
    </aside>
  </div>

  <section class="caption-overview" x-show="captionTab === 'overview'" id="caption-panel-overview" role="tabpanel" aria-labelledby="caption-tab-overview" @keydown.escape="closeCaptionDetail()" @resize.window.debounce.100ms="captionDetailNarrow = window.innerWidth < 1280" x-init="captionDetailNarrow = window.innerWidth < 1280">
    <div class="caption-overview-toolbar"><button class="btn btn-secondary btn-sm" :disabled="captionOverviewLoading || !captionBatchState().sourcePath" @click="rescanCaptionOverview()"><svg><use href="#ti-retry"></use></svg><span x-text="t('caption.rescan')"></span></button><div class="caption-overview-filters" :aria-label="t('caption.filter')"><template x-for="filter in ['all','missing','missing_json','ordinary','failed']" :key="filter"><button type="button" :class="{active:captionOverviewFilter === filter}" :disabled="filter === 'failed' && !captionBatchState().taskId" :title="filter === 'failed' && !captionBatchState().taskId ? t('caption.noTaskFailures') : ''" :aria-pressed="String(captionOverviewFilter === filter)" @click="setCaptionOverviewFilter(filter)"><span x-text="t('caption.filter_' + filter)"></span><small x-text="filter === 'all' ? captionBatchState().source?.total || 0 : filter === 'failed' ? captionBatchState().task?.failed || 0 : captionOverviewCounts[{missing:'missing_outputs',missing_json:'missing_json',ordinary:'ordinary_outputs'}[filter]] || 0"></small></button></template></div><input class="tagger-text-input caption-overview-search" type="search" x-model="captionOverviewQuery" @input.debounce.250ms="captionOverviewSearch()" :placeholder="t('caption.searchFiles')" :aria-label="t('caption.searchFiles')"></div>
    <p class="caption-overview-source" x-text="captionBatchState().source?.path || t('caption.selectDirectory')"></p>
    <div class="caption-overview-progress" x-show="taggerRunning"><span x-text="taggerPhaseLabel() + ' · ' + taggerTaskProgressText()"></span><div class="tagger-progress-track"><i :style="'width:' + taggerProgressPercent() + '%'"></i></div><button class="btn btn-secondary btn-sm" :disabled="taggerTask?.status === 'cancelling'" @click="cancelTagger()" x-text="t('tagger.stop')"></button><button class="btn btn-secondary btn-sm" @click="selectCaptionTab('batch'); taggerLogsOpen = true" x-text="t('tagger.logTitle')"></button></div>
    <div class="caption-overview-body" :class="{'has-detail':captionOverviewDetail}">
      <div class="caption-overview-gallery" :aria-busy="String(captionOverviewLoading)">
        <div class="dashboard-empty caption-empty" x-show="captionOverviewLoading && !captionOverviewItems.length" role="status" x-text="t('caption.loading')"></div>
        <div class="dashboard-empty caption-empty" x-show="captionOverviewError" role="alert"><p x-text="captionOverviewError"></p><button class="btn btn-secondary btn-sm" @click="rescanCaptionOverview()" x-text="t('caption.rescan')"></button></div>
        <div class="dashboard-empty caption-empty" x-show="!captionOverviewLoading && !captionOverviewError && !captionOverviewItems.length"><p x-text="t(!captionBatchState().source ? 'caption.overviewNoDirectory' : captionBatchState().source.total ? 'caption.noMatches' : 'caption.noImages')"></p><button class="btn btn-secondary btn-sm" @click="selectCaptionTab('batch')" x-text="t('caption.tab_batch')"></button></div>
        <div class="caption-overview-grid" x-show="!captionOverviewError"><template x-for="item in captionOverviewItems" :key="item.path"><button type="button" class="caption-overview-item" :disabled="captionOverviewLoading" :class="{selected:captionOverviewDetail?.path === item.path}" @click="openCaptionDetail(item,$el)" :aria-label="item.relative + ' · ' + t('caption.kind_' + item.caption_kind)"><span class="caption-overview-thumb" x-data="{broken:false}" x-effect="item.updated_at; broken = false"><img loading="lazy" decoding="async" :src="captionOverviewImage(item.index)" :alt="item.name" x-show="!broken" @error="broken = true"><span x-show="broken" x-text="t('caption.imageUnavailable')"></span></span><strong :title="item.relative" x-text="item.relative"></strong><span class="caption-overview-meta"><span :class="item.caption_kind" x-text="t('caption.kind_' + item.caption_kind)"></span><span class="caption-task-state" x-show="item.task?.status" :class="item.task?.status" x-text="t('caption.state_' + item.task?.status)"></span></span><small class="caption-overview-lengths" x-text="Object.entries(item.candidate_lengths || {}).map(([key,value]) => t('moss.candidate_' + key) + ' ' + value).join(' · ')"></small><span class="caption-overview-excerpt" x-show="item.read_error || item.task?.error || item.caption_kind !== 'missing'" x-text="item.read_error || item.task?.error || item.caption_excerpt || t('caption.noCaptionText')"></span></button></template></div>
        <footer class="caption-overview-pagination"><span role="status" x-text="captionOverviewLoading ? t('caption.loading') : t('caption.pageRange').replace('{start}',captionOverviewTotal ? captionOverviewOffset + 1 : 0).replace('{end}',Math.min(captionOverviewTotal,captionOverviewOffset + 60)).replace('{total}',captionOverviewTotal)"></span><button class="btn btn-secondary btn-sm" :disabled="captionOverviewLoading || captionOverviewOffset === 0" @click="captionOverviewPage(-1)" x-text="t('caption.previous')"></button><button class="btn btn-secondary btn-sm" :disabled="captionOverviewLoading || captionOverviewOffset + 60 >= captionOverviewTotal" @click="captionOverviewPage(1)" x-text="t('caption.next')"></button></footer>
      </div>
      <div class="caption-detail-backdrop" x-show="captionOverviewDetail && captionDetailNarrow" @click="closeCaptionDetail()"></div>
      <aside class="caption-overview-detail modal-workbench" x-show="captionOverviewDetail" :role="captionDetailNarrow ? 'dialog' : 'region'" :aria-modal="captionDetailNarrow ? 'true' : null" :aria-label="t('caption.annotationDetail')" @keydown="captionDetailKey($event)">
        <header class="caption-viewer-heading"><h2 x-text="captionOverviewDetail?.name"></h2><button type="button" class="btn btn-secondary btn-sm caption-detail-close" @click="closeCaptionDetail()" x-text="t('common.close')"></button></header>
        <p class="caption-detail-path" x-text="captionOverviewDetail?.path"></p><div class="caption-detail-image" x-data="{broken:false}" x-effect="captionOverviewDetail?.path; broken = false"><img :src="captionOverviewDetail ? captionOverviewImage(captionOverviewDetail.index,'original') : ''" :alt="captionOverviewDetail?.name || ''" x-show="!broken" @error="broken = true"><span x-show="broken" x-text="t('caption.imageUnavailable')"></span></div>
        <p role="status" x-show="captionDetailLoading" x-text="t('caption.loading')"></p><p role="alert" class="field-hint field-hint-warn" x-show="captionDetailError || captionOverviewDetail?.read_error" x-text="captionDetailError || captionOverviewDetail?.read_error"></p>
        <section class="caption-candidate-viewer" x-data="captionCandidateViewer(() => captionOverviewDetail)"><div class="caption-candidate-tabs"><template x-for="name in captionViewerNames()" :key="name"><button type="button" :class="{active:(captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name}" :aria-pressed="String((captionViewerNames().includes(candidate) ? candidate : captionViewerNames()[0]) === name)" @click="candidate = name" x-text="t('moss.candidate_' + name)"></button></template></div><div class="caption-viewer-heading"><small x-text="captionViewerText().length + ' ' + t('caption.characters')"></small><button class="btn btn-secondary btn-sm" :disabled="!captionViewerText()" @click="captionViewerCopy()"><svg><use href="#ti-copy"></use></svg><span x-text="t('caption.copy')"></span></button></div><div class="caption-candidate-text" tabindex="0" x-text="captionViewerText() || t('caption.noCaptionText')"></div></section>
        <p class="field-hint field-hint-warn" x-show="captionOverviewDetail?.sidecar_error" x-text="captionOverviewDetail?.sidecar_error"></p>
        <details><summary x-text="t('caption.promptReferenceKnowledge')"></summary><pre x-text="captionOverviewDetail?.sidecar?.prompt"></pre><pre x-text="captionOverviewDetail?.reference"></pre><pre x-text="captionOverviewDetail?.sidecar?.knowledge"></pre></details><details><summary x-text="t('caption.resultJson')"></summary><pre x-text="JSON.stringify(captionOverviewDetail?.sidecar || {},null,2)"></pre></details>
      </aside>
    </div>
    <p class="field-hint" x-text="t('caption.overviewRules')"></p>
  </section>
  <dialog class="modal-overlay caption-prompt-dialog" x-dialog="captionPromptOpen" @click.self="captionPromptOpen = false" @close="captionPromptOpen = false"><div class="modal modal-workbench"><div class="caption-viewer-heading"><h2 x-text="t('caption.effectivePrompt')"></h2><button class="btn btn-secondary btn-sm" @click="captionPromptOpen = false" x-text="t('common.close')"></button></div><p class="caption-detail-path" x-text="captionCheckPromptPath"></p><pre tabindex="0" x-text="captionCheckPrompt"></pre></div></dialog>
</div>
