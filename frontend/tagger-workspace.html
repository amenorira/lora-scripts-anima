<svg class="tagger-ui-sprite" aria-hidden="true">
  <symbol id="ti-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v10H3z"/><path d="M3 6v12"/></symbol>
  <symbol id="ti-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="ti-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></symbol>
  <symbol id="ti-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol>
  <symbol id="ti-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="ti-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="ti-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
  <symbol id="ti-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="ti-collapse-all" viewBox="0 0 24 24"><path d="M12 3v6m-4-4 4 4 4-4M12 21v-6m-4 4 4-4 4 4M4 12h16"/></symbol>
  <symbol id="ti-expand-all" viewBox="0 0 24 24"><path d="M12 9V3m-4 4 4-4 4 4M12 15v6m-4-4 4 4 4-4M4 12h16"/></symbol>
  <symbol id="ti-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="ti-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="ti-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="ti-eye-off" viewBox="0 0 24 24"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></symbol>
  <symbol id="ti-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
</svg>

<section class="tagger-page-shell" @paste.window="handleTaggerPaste($event)">
  <header class="page-header tagger-page-header">
    <div class="monitor-page-heading">
      <h1 class="page-title" x-text="currentRoute === 'ai-captioning' ? t('moss.pageTitle') : t('tagger.title', 'Tagger')"></h1>
    </div>
    <div id="taggerResbar" class="monitor-resbar tagger-page-resbar"></div>
  </header>

  <nav class="tagger-mode-tabs" x-show="currentRoute !== 'ai-captioning'" :aria-label="t('tagger.sourceType')" x-effect="currentRoute; taggerSourceMode; locale; $nextTick(() => _syncTaggerTabIndicator())" @resize.window.debounce.100ms="_syncTaggerTabIndicator()">
    <button type="button" :class="{active:taggerSourceMode === 'folder'}" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('folder')" x-text="t('tagger.batchMode')"></button>
    <button type="button" :class="{active:taggerSourceMode === 'single'}" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('single')" x-text="t('tagger.singleMode')"></button>
    <span class="monitor-tab-indicator" aria-hidden="true"></span>
  </nav>
  <p class="caption-intro field-hint" x-show="currentRoute === 'ai-captioning'" x-text="t('caption.workflowIntro')"></p>


  <div class="tagger-training-notice" x-show="(trainingActive && !taggerModeIsApi()) || regularizationActive">
    <span x-text="regularizationActive ? t('common.regularizationBlocked') : t('tagger.trainingBlocked', 'Training is using the GPU. Tagger is unavailable.')"></span>
    <button @click="navigate(regularizationActive ? 'regularization' : 'monitor-dashboard')"><span x-text="regularizationActive ? t('common.viewGeneration') : t('tagger.openMonitor', 'Open monitor')"></span><svg><use href="#ti-external"></use></svg></button>
  </div>

  <template x-if="taggerSourceMode === 'folder'">
    <div class="tagger-batch-layout">
      <main class="tagger-form-column">
        <section class="tagger-form-card">
          <h2 x-text="t('tagger.basicSettings', 'Basic settings')"></h2>
          <div class="tagger-form-field tagger-form-field-stacked">
            <div class="tagger-field-info"><label x-text="t('tagger.imageDir', 'Image folder')"></label></div>
            <div class="tagger-path-control">
              <input type="text" x-model="taggerSourcePath" @input="scheduleTaggerSourceScan()" @keydown.enter.prevent="scanTaggerSource()" :placeholder="t('tagger.sourcePath', 'Select an image folder')">
              <button type="button" x-show="localPickerAvailable" @click="pickTaggerSource()" :title="t('common.browse', 'Browse')"><svg><use href="#ti-folder"></use></svg></button>
            </div>
          </div>
        </section>

        <section class="tagger-form-card">
          <h2 x-text="t('tagger.modelSettings', 'Model settings')"></h2>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.model', 'Tagger model')"></label></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-model-select" x-data="animaSelect(() => taggerModelSelectConfig(), taggerSelectedModel)" x-effect="value = taggerSelectedModel" @click.outside="close()" @anima-select-change="changeTaggerModel($event.detail.value)">
                <input type="hidden" x-ref="modelInput" :value="taggerSelectedModel">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.model')"><span class="anima-select-trigger-text" x-text="taggerModel()?.name || t('tagger.model')"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }"><div class="anima-select-menu-scroll"><template x-for="group in displayGroups" :key="group.label"><div class="anima-select-group"><div class="anima-select-group-label" x-text="group.label"></div><template x-for="opt in group.options" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></template></div></div></template>
              </div>
              <div class="tagger-model-meta"><span x-text="taggerRuntimeLabel()"></span><span x-text="taggerModel()?.installed ? t('tagger.installed', 'Installed') : t('tagger.firstUseDownload', 'Downloads on first use')"></span></div>
            </div>
          </div>
          <div class="tagger-form-field" x-show="taggerSelectedModel === 'pixai-tagger-v1.0'">
            <div class="tagger-field-info"><label x-text="t('tagger.precision')"></label><p x-text="t('tagger.precisionHelp')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPrecisionSelectConfig(), taggerSettings.precision)" x-effect="value = taggerSettings.precision" @click.outside="close()" @anima-select-change="taggerSettings.precision = $event.detail.value; saveTaggerSettings()">
                <input type="hidden" :value="taggerSettings.precision">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.precision')"><span class="anima-select-trigger-text" x-text="t('tagger.precision_' + taggerSettings.precision)"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-form-field" x-show="!taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.preset', 'Inference preset')"></label><p x-text="t('tagger.presetHelp')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="close()" @anima-select-change="applyTaggerPreset($event.detail.value)">
                <input type="hidden" x-ref="modelInput" :value="taggerSettings.preset">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-form-field" x-show="!taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.threshold')"></label><p x-text="t('tagger.thresholdDesc')"></p></div>
            <div class="tagger-field-control"><div class="stepper tagger-field-stepper"><button type="button" @click="taggerSettings.threshold = Number(Math.max(0, Number(taggerSettings.threshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input type="number" :aria-label="t('tagger.threshold')" min="0" max="1" step="0.01" x-model.number="taggerSettings.threshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.threshold = Number(Math.min(1, Number(taggerSettings.threshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
          </div>
          <div class="tagger-form-field" x-show="taggerSupportsCharacterToggle()">
            <div class="tagger-field-info"><label x-text="t('tagger.characterRecognition')"></label><p x-text="t('tagger.characterRecognitionDesc')"></p></div>
            <div class="tagger-field-control"><label class="toggle"><input type="checkbox" :checked="taggerCharacterEnabled()" @change="setTaggerCharacterEnabled($event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></label></div>
          </div>
          <div class="tagger-form-field" x-show="taggerSupportsCharacterToggle() && taggerCharacterEnabled()">
            <div class="tagger-field-info"><label x-text="t('tagger.characterThreshold')"></label><p x-text="t('tagger.characterThresholdDesc')"></p></div>
            <div class="tagger-field-control"><div class="stepper tagger-field-stepper"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.max(0, Number(taggerSettings.characterThreshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input type="number" :aria-label="t('tagger.characterThreshold')" min="0" max="1" step="0.01" x-model.number="taggerSettings.characterThreshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.min(1, Number(taggerSettings.characterThreshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
          </div>
          <div class="tagger-form-field" x-show="taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.categoryThresholds')"></label><p x-text="t('tagger.categoryThresholdsDesc')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="close()" @anima-select-change="applyTaggerPreset($event.detail.value)">
                <input type="hidden" :value="taggerSettings.preset">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-category-settings" x-show="taggerUsesCategoryThresholds()">
            <template x-for="key in taggerCategoryKeys()" :key="key"><div class="tagger-category-field"><label class="tagger-category-toggle"><span class="toggle"><input type="checkbox" :checked="taggerCategoryEnabled(key)" @change="setTaggerCategoryEnabled(key, $event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></span><span x-text="taggerCategoryLabel(key)"></span></label><div class="tagger-category-controls"><div class="stepper tagger-field-stepper"><button type="button" @click="adjustTaggerCategoryThreshold(key, -0.01)">&minus;</button><input type="number" :aria-label="taggerCategoryLabel(key) + ' ' + t('tagger.threshold')" min="0" max="1" step="0.001" x-model.number="taggerSettings.categoryThresholds[key]" @change="updateTaggerCategorySetting(key)"><button type="button" @click="adjustTaggerCategoryThreshold(key, 0.01)">+</button></div></div></div></template>
          </div>
        </section>


        <section class="tagger-form-card">
          <h2 x-text="t('tagger.outputOptions', 'Output options')"></h2>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.conflictAction')"></label></div>
            <div class="tagger-field-control"><div class="anima-select tagger-conflict-select" x-data="animaSelect(() => taggerConflictSelectConfig(), taggerSettings.conflict)" x-effect="value = taggerSettings.conflict" @click.outside="close()" @anima-select-change="taggerSettings.conflict = $event.detail.value; saveTaggerSettings()"><input type="hidden" x-ref="modelInput" :value="taggerSettings.conflict"><button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.conflict; toggle($event)"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button><template x-if="open"><div class="anima-select-menu" :class="{ 'anima-select-menu-positioned': positioned }"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-label" x-text="opt.l"></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template></div></div>
          </div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.additionalTags')"></label><p x-text="t('tagger.additionalTagsDesc')"></p></div>
            <div class="tagger-field-control"><input class="tagger-text-input" type="text" x-model="taggerSettings.additionalTags" @change="saveTaggerSettings()" placeholder="1girl, solo"></div>
          </div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.excludeTags')"></label><p x-text="t('tagger.excludeTagsDesc')"></p></div>
            <div class="tagger-field-control"><input class="tagger-text-input" type="text" x-model="taggerSettings.excludeTags" @change="saveTaggerSettings()" placeholder="watermark, text"></div>
          </div>
          <div class="tagger-option-grid">
            <label><span><b x-text="t('tagger.recursive')"></b><small x-text="t('tagger.recursiveDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.recursive" @change="saveTaggerSettings(); scanTaggerSource()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.replaceUnderscore')"></b></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.replaceUnderscore" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.escapeTag')"></b><small x-text="t('tagger.escapeTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.escapeTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.removeDuplicated')"></b></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.removeDuplicated" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label x-show="taggerSupportsStandaloneRatingToggle()"><span><b x-text="t('tagger.addRatingTag')"></b><small x-text="t('tagger.addRatingTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addRatingTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label x-show="taggerSupportsModelTag()"><span><b x-text="t('tagger.addModelTag')"></b><small x-text="t('tagger.addModelTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addModelTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.unloadModel')"></b><small x-text="t('tagger.unloadModelDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.unloadModel" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
          </div>
        </section>

      </main>

      <aside class="tagger-action-panel">
        <h2 x-text="t('tagger.batchMode')"></h2>
        <div class="tagger-action-source" :class="{ ready: taggerSource?.total }"><svg><use href="#ti-folder"></use></svg><div><strong x-text="taggerSource?.total ? (taggerSource.total + ' ' + t('tagger.images')) : t('tagger.noSource')"></strong><span x-text="taggerSource?.path || t('tagger.imageDirDesc')"></span></div></div>
        <div class="tagger-source-summary" x-show="taggerSource"><span><strong x-text="taggerSource?.total || 0"></strong><small x-text="t('tagger.images')"></small></span><span><strong x-text="taggerSource?.directories || 0"></strong><small x-text="t('tagger.folders')"></small></span><span><strong x-text="taggerSource?.with_caption || 0"></strong><small x-text="t('tagger.captions')"></small></span></div>
        <button class="tagger-start-button" x-show="!taggerRunning" @click="startTagger()" :disabled="!taggerCanStart()"><svg><use href="#ti-play"></use></svg><span x-text="taggerStartLabel()"></span></button>
        <button class="tagger-stop-button" x-show="taggerRunning" @click="cancelTagger()"><svg><use href="#ti-stop"></use></svg><span x-text="t('tagger.stop')"></span></button>
        <div class="tagger-task-status" x-show="taggerTask">
          <div class="tagger-task-title"><i :class="taggerTask?.status || 'idle'"></i><strong x-text="taggerPhaseLabel()"></strong><span x-text="taggerTaskProgressText()"></span></div>
          <div class="tagger-progress-track"><i :style="'width:' + taggerProgressPercent() + '%'"></i></div>
          <div class="tagger-task-file" x-text="taggerTask?.current_file || ''"></div>
          <dl><div><dt x-text="t('tagger.speed')"></dt><dd x-text="taggerTask?.speed ? taggerTask.speed + ' img/s' : '--'"></dd></div><div><dt>ETA</dt><dd x-text="formatTaggerEta(taggerTask?.eta_seconds)"></dd></div><div><dt x-text="t('tagger.success')"></dt><dd class="success" x-text="taggerTask?.success || 0"></dd></div><div><dt x-text="t('tagger.skipped')"></dt><dd class="skipped" x-text="taggerTask?.skipped || 0"></dd></div><div><dt x-text="t('tagger.failed')"></dt><dd class="failed" x-text="taggerTask?.failed || 0"></dd></div></dl>
        </div>
        <button class="tagger-secondary-button" x-show="taggerTask?.failed" @click="retryFailedTagger()"><svg><use href="#ti-retry"></use></svg><span x-text="t('tagger.retryFailed')"></span></button>
        <button class="tagger-secondary-button" x-show="taggerTask?.status === 'done' && taggerSource?.kind === 'folder'" @click="openTaggerDatasetInEditor()"><span x-text="t('tagger.openTagEditor')"></span><svg><use href="#ti-external"></use></svg></button>
        <section class="tagger-action-log" :class="{ expanded: taggerLogsOpen }">
          <header><div><strong x-text="t('tagger.logTitle', 'Tagger log')"></strong><span class="tagger-log-phase" :class="{ running: taggerRunning }" x-text="taggerPhaseLabel()"></span></div><button x-show="taggerTask?.logs?.length" @click="taggerLogsOpen = !taggerLogsOpen" x-text="taggerLogsOpen ? t('common.collapse', 'Collapse') : t('common.expand', 'Expand')"></button></header>
          <div class="tagger-error-summary" x-show="taggerTask?.error_detail"><strong x-text="t('tagger.error')"></strong><span x-text="taggerTask?.error_detail"></span></div>
          <div class="tagger-log-stream" x-data="{ follow: true }" x-init="$watch('taggerTaskId', () => follow = true)" @scroll="follow = $el.scrollHeight - $el.scrollTop - $el.clientHeight < 24" x-effect="taggerTask?.logs; taggerLogsOpen; $nextTick(() => { if (follow) $el.scrollTop = $el.scrollHeight })"><template x-for="(line, index) in taggerVisibleLogs()" :key="index"><div class="tagger-log-line" :class="line.level"><time class="tagger-log-time" x-text="line.time"></time><code class="tagger-log-message" x-text="taggerLogMessage(line)"></code></div></template><div class="tagger-log-empty" x-show="!taggerTask?.logs?.length" x-text="t('tagger.logsEmpty')"></div></div>
        </section>
      </aside>
    </div>
  </template>

  <template x-if="taggerSourceMode === 'single'">
    <div
      class="tagger-single-layout"
      :style="'--tagger-single-left:' + taggerSingleLeftWidth + '%'"
      @pointermove.window="resizeTaggerSingleLayout($event)"
      @pointerup.window="stopTaggerSingleResize()"
      @pointercancel.window="stopTaggerSingleResize()"
    >
      <div class="tagger-single-main">
