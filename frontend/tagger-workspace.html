  <symbol id="ti-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>

  <symbol id="ti-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
  <symbol id="ti-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
</svg>

<section class="tagger-page-shell">
  <header class="page-header tagger-page-header">
    <div class="monitor-page-heading">
      <h1 class="page-title" x-text="t('tagger.title', 'Tagger')"></h1>
      <span class="monitor-page-kicker" x-text="t('tagger.subtitle', 'Automatically tag images with local models')"></span>
    </div>
    <div id="taggerResbar" class="monitor-resbar tagger-page-resbar"></div>
  </header>

  <nav class="tagger-mode-tabs" :aria-label="t('tagger.sourceType', 'Source type')">
    <button type="button" :class="{ active: taggerSourceMode === 'folder' }" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('folder')" x-text="t('tagger.batchMode', 'Batch mode')"></button>
    <button type="button" :class="{ active: taggerSourceMode === 'single' }" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('single')" x-text="t('tagger.singleMode', 'Single image')"></button>
    <button type="button" :class="{ active: taggerSourceMode === 'api-folder' }" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('api-folder')" x-text="t('tagger.apiBatchMode', 'AI batch')"></button>
    <button type="button" :class="{ active: taggerSourceMode === 'api-single' }" :disabled="taggerRunning || taggerStarting || taggerScanning" @click="selectTaggerSourceMode('api-single')" x-text="t('tagger.apiSingleMode', 'AI single')"></button>
    <span class="monitor-tab-indicator" aria-hidden="true"></span>
  </nav>

  <div class="tagger-training-notice" x-show="trainingActive && !taggerModeIsApi()">
    <span x-text="t('tagger.trainingBlocked', 'Training is using the GPU. Tagger is unavailable.')"></span>
    <button @click="navigate('monitor-dashboard')"><span x-text="t('tagger.openMonitor', 'Open monitor')"></span><svg><use href="#ti-external"></use></svg></button>
  </div>

  <template x-if="taggerSourceMode === 'folder'">
    <div class="tagger-batch-layout">
      <main class="tagger-form-column">
        <section class="tagger-form-card">
          <h2 x-text="t('tagger.basicSettings', 'Basic settings')"></h2>
          <div class="tagger-form-field tagger-form-field-stacked">
            <div class="tagger-field-info"><label x-text="t('tagger.imageDir', 'Image folder')"></label><p x-text="t('tagger.imageDirDesc', 'Folder containing images to tag')"></p></div>
            <div class="tagger-path-control">
              <input type="text" x-model="taggerSourcePath" @input="scheduleTaggerSourceScan()" @keydown.enter.prevent="scanTaggerSource()" :placeholder="t('tagger.sourcePath', 'Select an image folder')">
              <button type="button" x-show="localPickerAvailable" @click="pickTaggerSource()" :title="t('common.browse', 'Browse')"><svg><use href="#ti-folder"></use></svg></button>
            </div>
          </div>
        </section>

        <section class="tagger-form-card">
          <h2 x-text="t('tagger.modelSettings', 'Model settings')"></h2>
          <div class="tagger-section-note" x-text="t('tagger.onnxSettingsDesc')"></div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.model', 'Tagger model')"></label><p x-text="t('tagger.modelDesc')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-model-select" x-data="animaSelect(() => taggerModelSelectConfig(), taggerSelectedModel)" x-effect="value = taggerSelectedModel" @click.outside="closeOnOutside()" @anima-select-change="changeTaggerModel($event.detail.value)">
                <input type="hidden" x-ref="modelInput" :value="taggerSelectedModel">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" :disabled="taggerRunning || taggerStarting" @click="toggle($event)" :aria-label="t('tagger.model')"><span class="anima-select-trigger-text" x-text="taggerModel()?.name || t('tagger.model')"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="group in displayGroups" :key="group.label"><div class="anima-select-group"><div class="anima-select-group-label" x-text="group.label"></div><template x-for="opt in group.options" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></template></div></div></template>
              </div>
              <div class="tagger-model-meta"><span>ONNX Runtime / CUDA</span><span x-text="taggerModel()?.installed ? t('tagger.installed', 'Installed') : t('tagger.firstUseDownload', 'Downloads on first use')"></span></div>
            </div>
          </div>
          <div class="tagger-form-field" x-show="!taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.preset', 'Inference preset')"></label><p x-text="t('tagger.presetHelp')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="closeOnOutside()" @anima-select-change="applyTaggerPreset($event.detail.value)">
                <input type="hidden" x-ref="modelInput" :value="taggerSettings.preset">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-form-field" x-show="!taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.threshold')"></label><p x-text="t('tagger.thresholdDesc')"></p></div>
            <div class="tagger-field-control"><div class="stepper tagger-field-stepper"><button type="button" @click="taggerSettings.threshold = Number(Math.max(0, Number(taggerSettings.threshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input type="number" min="0" max="1" step="0.01" x-model.number="taggerSettings.threshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.threshold = Number(Math.min(1, Number(taggerSettings.threshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
          </div>
          <div class="tagger-form-field" x-show="taggerSupportsCharacterToggle()">
            <div class="tagger-field-info"><label x-text="t('tagger.characterRecognition')"></label><p x-text="t('tagger.characterRecognitionDesc')"></p></div>
            <div class="tagger-field-control"><label class="toggle"><input type="checkbox" :checked="taggerCharacterEnabled()" @change="setTaggerCharacterEnabled($event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span></label></div>
          </div>
          <div class="tagger-form-field" x-show="taggerSupportsCharacterToggle() && taggerCharacterEnabled()">
            <div class="tagger-field-info"><label x-text="t('tagger.characterThreshold')"></label><p x-text="t('tagger.characterThresholdDesc')"></p></div>
            <div class="tagger-field-control"><div class="stepper tagger-field-stepper"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.max(0, Number(taggerSettings.characterThreshold) - 0.01).toFixed(2)); setTaggerCustomPreset()">&minus;</button><input type="number" min="0" max="1" step="0.01" x-model.number="taggerSettings.characterThreshold" @change="setTaggerCustomPreset()"><button type="button" @click="taggerSettings.characterThreshold = Number(Math.min(1, Number(taggerSettings.characterThreshold) + 0.01).toFixed(2)); setTaggerCustomPreset()">+</button></div></div>
          </div>
          <div class="tagger-form-field" x-show="taggerUsesCategoryThresholds()">
            <div class="tagger-field-info"><label x-text="t('tagger.categoryThresholds')"></label><p x-text="t('tagger.categoryThresholdsDesc')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-preset-select" x-data="animaSelect(() => taggerPresetSelectConfig(), taggerSettings.preset)" x-effect="value = taggerSettings.preset" @click.outside="closeOnOutside()" @anima-select-change="applyTaggerPreset($event.detail.value)">
                <input type="hidden" :value="taggerSettings.preset">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.preset; toggle($event)"><span class="anima-select-trigger-text" x-text="taggerPresetOptions().find(option => option[0] === taggerSettings.preset)?.[1] || taggerSettings.preset"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-category-settings" x-show="taggerUsesCategoryThresholds()">
            <template x-for="key in taggerCategoryKeys()" :key="key"><div class="tagger-category-field"><label class="tagger-category-toggle"><input type="checkbox" :checked="taggerCategoryEnabled(key)" @change="setTaggerCategoryEnabled(key, $event.target.checked)"><span x-text="taggerCategoryLabel(key)"></span></label><div class="tagger-category-controls"><div class="stepper tagger-field-stepper"><button type="button" @click="adjustTaggerCategoryThreshold(key, -0.01)">&minus;</button><input type="number" min="0" max="1" step="0.001" x-model.number="taggerSettings.categoryThresholds[key]" @change="updateTaggerCategorySetting(key)"><button type="button" @click="adjustTaggerCategoryThreshold(key, 0.01)">+</button></div></div></div></template>
          </div>
        </section>


        <section class="tagger-form-card">
          <h2 x-text="t('tagger.outputOptions', 'Output options')"></h2>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.conflictAction')"></label><p x-text="t('tagger.conflictActionDesc')"></p></div>
            <div class="tagger-field-control"><div class="anima-select tagger-conflict-select" x-data="animaSelect(() => taggerConflictSelectConfig(), taggerSettings.conflict)" x-effect="value = taggerSettings.conflict" @click.outside="closeOnOutside()" @anima-select-change="taggerSettings.conflict = $event.detail.value; saveTaggerSettings()"><input type="hidden" x-ref="modelInput" :value="taggerSettings.conflict"><button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerSettings.conflict; toggle($event)"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button><template x-if="open"><div class="anima-select-menu tagger-api-model-menu" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-label" x-text="opt.l"></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template></div></div>
          </div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.additionalTags')"></label><p x-text="t('tagger.additionalTagsDesc')"></p></div>
            <div class="tagger-field-control"><input class="tagger-text-input" type="text" x-model="taggerSettings.additionalTags" @change="saveTaggerSettings()" placeholder="1girl, solo"></div>
          </div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.excludeTags')"></label><p x-text="t('tagger.excludeTagsDesc')"></p></div>
            <div class="tagger-field-control"><input class="tagger-text-input" type="text" x-model="taggerSettings.excludeTags" @change="saveTaggerSettings()" placeholder="watermark, text"></div>
          </div>
          <div class="tagger-option-grid">
            <label><span><b x-text="t('tagger.recursive')"></b><small x-text="t('tagger.recursiveDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.recursive" @change="saveTaggerSettings(); scanTaggerSource()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.replaceUnderscore')"></b><small x-text="t('tagger.replaceUnderscoreDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.replaceUnderscore" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.escapeTag')"></b><small x-text="t('tagger.escapeTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.escapeTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.removeDuplicated')"></b><small x-text="t('tagger.removeDuplicatedDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.removeDuplicated" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label x-show="taggerSupportsStandaloneRatingToggle()"><span><b x-text="t('tagger.addRatingTag')"></b><small x-text="t('tagger.addRatingTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addRatingTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label x-show="taggerSupportsModelTag()"><span><b x-text="t('tagger.addModelTag')"></b><small x-text="t('tagger.addModelTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.addModelTag" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.unloadModel')"></b><small x-text="t('tagger.unloadModelDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerSettings.unloadModel" @change="saveTaggerSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
          </div>
        </section>

      </main>

      <aside class="tagger-action-panel">
        <h2 x-text="t('tagger.batchMode')"></h2>
        <div class="tagger-action-source" :class="{ ready: taggerSource?.total }"><svg><use href="#ti-folder"></use></svg><div><strong x-text="taggerSource?.total ? (taggerSource.total + ' ' + t('tagger.images')) : t('tagger.noSource')"></strong><span x-text="taggerSource?.path || t('tagger.imageDirDesc')"></span></div></div>
        <div class="tagger-source-summary" x-show="taggerSource"><span><strong x-text="taggerSource?.total || 0"></strong><small x-text="t('tagger.images')"></small></span><span><strong x-text="taggerSource?.directories || 0"></strong><small x-text="t('tagger.folders')"></small></span><span><strong x-text="taggerSource?.with_caption || 0"></strong><small x-text="t('tagger.captions')"></small></span></div>
        <button class="tagger-start-button" x-show="!taggerRunning" @click="startTagger()" :disabled="!taggerCanStart()"><svg><use href="#ti-play"></use></svg><span x-text="taggerStartLabel()"></span></button>
        <button class="tagger-stop-button" x-show="taggerRunning" @click="cancelTagger()"><svg><use href="#ti-stop"></use></svg><span x-text="t('tagger.stop')"></span></button>
        <div class="tagger-task-status" x-show="taggerTask">
          <div class="tagger-task-title"><i :class="taggerTask?.status || 'idle'"></i><strong x-text="taggerPhaseLabel()"></strong><span x-text="taggerTaskProgressText()"></span></div>
          <div class="tagger-progress-track"><i :style="'width:' + taggerProgressPercent() + '%'"></i></div>
          <div class="tagger-task-file" x-text="taggerTask?.current_file || ''"></div>
          <dl><div><dt x-text="t('tagger.speed')"></dt><dd x-text="taggerTask?.speed ? taggerTask.speed + ' img/s' : '--'"></dd></div><div><dt>ETA</dt><dd x-text="formatTaggerEta(taggerTask?.eta_seconds)"></dd></div><div><dt x-text="t('tagger.success')"></dt><dd class="success" x-text="taggerTask?.success || 0"></dd></div><div><dt x-text="t('tagger.skipped')"></dt><dd class="skipped" x-text="taggerTask?.skipped || 0"></dd></div><div><dt x-text="t('tagger.failed')"></dt><dd class="failed" x-text="taggerTask?.failed || 0"></dd></div></dl>
        </div>
        <button class="tagger-secondary-button" x-show="taggerTask?.failed" @click="retryFailedTagger()"><svg><use href="#ti-retry"></use></svg><span x-text="t('tagger.retryFailed')"></span></button>
        <button class="tagger-secondary-button" x-show="taggerTask?.status === 'done' && taggerSource?.kind === 'folder'" @click="openTaggerDatasetInEditor()"><span x-text="t('tagger.openTagEditor')"></span><svg><use href="#ti-external"></use></svg></button>
        <section class="tagger-action-log">
          <header><div><strong x-text="t('tagger.logTitle', 'Tagger log')"></strong><span class="tagger-log-phase" :class="{ running: taggerRunning }" x-text="taggerPhaseLabel()"></span></div><button x-show="taggerHasLogs()" @click="taggerLogsOpen = !taggerLogsOpen" x-text="taggerLogsOpen ? t('common.collapse', 'Collapse') : t('common.expand', 'Expand')"></button></header>
          <div class="tagger-error-summary" x-show="taggerTask?.error_detail"><strong x-text="t('tagger.error')"></strong><span x-text="taggerTask?.error_detail"></span></div>
          <div class="tagger-log-stream" x-effect="taggerLogCount(); $nextTick(() => { $el.scrollTop = $el.scrollHeight })"><template x-for="(line, index) in taggerVisibleLogs()" :key="index + ':' + line"><div class="tagger-log-line" :class="taggerLogTone(line)"><time class="tagger-log-time" x-text="taggerLogTime(line)"></time><code class="tagger-log-message" x-text="taggerLogMessage(line)"></code></div></template><div class="tagger-log-empty" x-show="!taggerHasLogs()" x-text="t('tagger.logsEmpty')"></div></div>
        </section>
      </aside>
    </div>
  </template>

  <template x-if="taggerSourceMode === 'single'">
    <div
      class="tagger-single-layout"
      :style="'--tagger-single-left:' + taggerSingleLeftWidth + '%'"
      @pointermove.window="resizeTaggerSingleLayout($event)"
      @pointerup.window="stopTaggerSingleResize()"
      @pointercancel.window="stopTaggerSingleResize()"
    >
      <div class="tagger-single-main">
        <main class="tagger-single-preview" :class="{ 'drag-over': taggerDragOver }" @dragover.prevent="taggerDragOver = true" @dragleave="if (!$el.contains($event.relatedTarget)) taggerDragOver = false" @drop.prevent="handleTaggerDrop($event)">
          <div class="tagger-preview-toolbar"><span x-text="taggerSource?.display_name || taggerSource?.path || t('tagger.noImage')"></span><button x-show="taggerSource" @click="resetTaggerPreview()" :title="t('tagger.fit')" :aria-label="t('tagger.fit')"><svg><use href="#ti-fit"></use></svg></button></div>
          <button class="tagger-drop-zone" x-show="!taggerSource" @click="pickTaggerSource()"><svg><use href="#ti-image"></use></svg><strong x-text="t('tagger.dropImageHere')"></strong><span x-text="t('tagger.orPaste')"></span></button>
          <div class="tagger-preview-image" :class="{ zoomed: taggerPreviewScale > 1, panning: taggerPreviewPanning }" x-show="taggerSource" @wheel.prevent="zoomTaggerPreview($event)" @pointerdown="startTaggerPreviewPan($event)" @pointermove="moveTaggerPreviewPan($event)" @pointerup="stopTaggerPreviewPan($event)" @pointercancel="stopTaggerPreviewPan($event)" @dblclick="resetTaggerPreview()"><img :src="taggerPreviewUrl(taggerSelectedIndex)" :style="taggerPreviewTransform()" :alt="t('tagger.preview')" @load="resetTaggerPreview()" draggable="false"></div>
        </main>

        <section class="tagger-form-card">
          <h2 x-text="t('tagger.apiPrompt')"></h2>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.apiPromptPreset')"></label><p x-text="t('tagger.apiPromptPresetDesc')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-api-prompt-select" x-data="animaSelect(() => taggerApiPromptSelectConfig(), taggerApiSettings.promptPresetId)" x-effect="value = taggerApiSettings.promptPresetId" @click.outside="closeOnOutside()" @anima-select-change="selectTaggerApiPromptPreset($event.detail.value)">
                <input type="hidden" :value="taggerApiSettings.promptPresetId">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerApiSettings.promptPresetId; toggle($event)"><span class="anima-select-trigger-text" x-text="taggerApiPresetLabel()"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="group in displayGroups" :key="group.label"><div class="anima-select-group"><div class="anima-select-group-label" x-text="group.label"></div><template x-for="opt in group.options" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-label" x-text="opt.l"></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></template></div></div></template>
              </div>
            </div>
          </div>
          <div class="tagger-form-field tagger-form-field-stacked">
            <textarea class="tagger-prompt-textarea" rows="6" x-model="taggerApiSettings.promptText" @input.debounce.500ms="saveTaggerApiSettings()" :placeholder="t('tagger.apiPromptPlaceholder')" spellcheck="false"></textarea>
            <div class="tagger-prompt-actions" x-show="!taggerApiPresetNaming">
              <button type="button" @click="startTaggerApiPresetNaming('save')"><svg><use href="#ti-save"></use></svg><span x-text="t('tagger.apiPromptSaveAs')"></span></button>
              <button type="button" x-show="taggerApiPresetIsUser()" @click="startTaggerApiPresetNaming('rename')"><span x-text="t('tagger.apiPromptRename')"></span></button>
              <button type="button" class="danger" x-show="taggerApiPresetIsUser()" @click="deleteTaggerApiPrompt()"><span x-text="t('common.delete', 'Delete')"></span></button>
            </div>
            <div class="tagger-prompt-naming" x-show="taggerApiPresetNaming">
              <input type="text" x-model="taggerApiPresetNameInput" @keydown.enter.prevent="confirmTaggerApiPresetSave()" @keydown.esc.prevent="taggerApiPresetNaming = false" :placeholder="t('tagger.apiPromptNamePlaceholder')">
              <button type="button" @click="confirmTaggerApiPresetSave()" x-text="t('common.confirm', 'Confirm')"></button>
              <button type="button" @click="taggerApiPresetNaming = false" x-text="t('common.cancel', 'Cancel')"></button>
            </div>
          </div>
          <div class="tagger-form-field">
            <div class="tagger-field-info"><label x-text="t('tagger.apiParseMode')"></label><p x-text="t('tagger.apiParseModeDesc')"></p></div>
            <div class="tagger-field-control">
              <div class="anima-select tagger-api-parse-select" x-data="animaSelect(() => taggerApiParseModeConfig(), taggerApiSettings.parseMode)" x-effect="value = taggerApiSettings.parseMode" @click.outside="closeOnOutside()" @anima-select-change="taggerApiSettings.parseMode = $event.detail.value; saveTaggerApiSettings()">
                <input type="hidden" :value="taggerApiSettings.parseMode">
                <button type="button" class="anima-select-trigger" :class="{ focused: open }" @click="value = taggerApiSettings.parseMode; toggle($event)"><span class="anima-select-trigger-text" x-text="selectedLabel"></span><svg class="anima-select-chevron" :class="{ open: open }"><use href="#ti-chevron"></use></svg></button>
                <template x-if="open"><div class="anima-select-menu anima-select-menu-described" :class="{ 'anima-select-menu-positioned': positioned }" x-init="$nextTick(() => positionMenu())"><div class="anima-select-menu-scroll"><template x-for="opt in flatOptions" :key="opt.v"><div class="anima-select-option" :class="{ active: opt.v === value }" @click="select(opt.v)"><span class="anima-select-option-content"><span class="anima-select-option-label" x-text="opt.l"></span><span class="anima-select-option-desc" x-text="opt.d"></span></span><svg class="anima-select-check" x-show="opt.v === value"><use href="#ti-check"></use></svg></div></template></div></div></template>
              </div>
            </div>
          </div>
        </section>

        <section class="tagger-form-card tagger-single-output-settings">
          <h2 x-text="t('tagger.outputOptions', 'Output options')"></h2>
          <div class="tagger-option-grid tagger-single-option-grid">
            <label><span><b x-text="t('tagger.replaceUnderscore')"></b><small x-text="t('tagger.replaceUnderscoreDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerApiSettings.replaceUnderscore" @change="saveTaggerApiSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.escapeTag')"></b><small x-text="t('tagger.escapeTagDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerApiSettings.escapeTag" @change="saveTaggerApiSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
            <label><span><b x-text="t('tagger.removeDuplicated')"></b><small x-text="t('tagger.removeDuplicatedDesc')"></small></span><span class="toggle"><input type="checkbox" x-model="taggerApiSettings.removeDuplicated" @change="saveTaggerApiSettings()"><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
          </div>
        </section>
      </aside>
    </div>
  </template>
</section>

<input id="taggerFileInput" type="file" accept="image/*" hidden @change="handleTaggerFileInput($event)">
